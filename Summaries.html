<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستعرض المذكرات والملفات</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; transition: 0.3s; }
        
        .container { max-width: 1000px; margin: 0 auto; background: var(--white); padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); min-height: 80vh; display: flex; flex-direction: column; }
        
        header { text-align: center; border-bottom: 2px solid #eee; margin-bottom: 25px; padding-bottom: 10px; }
        h1 { color: var(--primary); margin: 0; font-size: 1.8rem; }

        /* منطقة الرفع */
        .upload-area { border: 3px dashed var(--accent); background: #f9fbff; padding: 40px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.3s; position: relative; }
        .upload-area:hover { background: #f0f7ff; border-color: #2980b9; }
        .upload-area p { margin: 10px 0 0; color: #666; font-size: 1.1rem; }
        #fileInput { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; }

        /* شريط الأدوات */
        .toolbar { display: none; background: #f1f1f1; padding: 10px; border-radius: 8px; margin-bottom: 20px; justify-content: center; gap: 15px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; }
        .btn { padding: 8px 15px; border: 1px solid #ccc; background: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #e9e9e9; }
        .file-name { font-weight: bold; color: var(--accent); margin-bottom: 10px; display: none; text-align: center; }

        /* منطقة القراءة */
        #viewer { 
            display: none; 
            padding: 30px; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            line-height: 1.8; 
            font-size: 1.25rem; 
            white-space: pre-wrap; 
            text-align: justify;
            background: #fff;
            color: #222;
        }

        /* الوضع الليلي */
        .dark-mode { background: #1a1a1a !important; color: #eee !important; }
        .dark-mode #viewer { background: #2c2c2c !important; color: #ddd !important; border-color: #444; }
    </style>
</head>
<body id="body">

<div class="container">
    <header>
        <h1>📚 مستعرض الملفات والمذكرات التعليمية</h1>
    </header>

    <div class="upload-area" id="uploadArea">
        <div style="font-size: 50px;">📄</div>
        <p>اسحب ملفك هنا أو اضغط للاختيار</p>
        <input type="file" id="fileInput" accept=".txt,.html,.js,.css,.text,.pdf" onchange="processFile(this.files)">
    </div>

    <div id="fileName" class="file-name"></div>

    <div class="toolbar" id="toolbar">
        <button class="btn" onclick="adjustFont(2)">تكبير الخط +</button>
        <button class="btn" onclick="adjustFont(-2)">تصغير الخط -</button>
        <button class="btn" onclick="toggleDark()">الوضع الليلي 🌙</button>
        <button class="btn" style="color: #c0392b;" onclick="resetAll()">حذف الملف 🗑️</button>
    </div>

    <div id="viewer"></div>
</div>

<script>
    const viewer = document.getElementById('viewer');
    const toolbar = document.getElementById('toolbar');
    const uploadArea = document.getElementById('uploadArea');
    const fileNameDiv = document.getElementById('fileName');

    function processFile(files) {
        const file = files[0];
        if (!file) return;

        // إخفاء منطقة الرفع وإظهار الأدوات
        uploadArea.style.display = 'none';
        toolbar.style.display = 'flex';
        fileNameDiv.style.display = 'block';
        fileNameDiv.textContent = "المستند الحالي: " + file.name;

        const reader = new FileReader();
        reader.onload = function(e) {
            viewer.textContent = e.target.result;
            viewer.style.display = 'block';
        };

        // ملاحظة: قراءة الملفات كنص. لملفات PDF يفضل استخدام مكتبة PDF.js 
        // ولكن هذا القارئ يدعم الملفات النصية والبرمجية بشكل ممتاز.
        reader.readAsText(file);
    }

    function adjustFont(amount) {
        const style = window.getComputedStyle(viewer, null).getPropertyValue('font-size');
        const currentSize = parseFloat(style);
        viewer.style.fontSize = (currentSize + amount) + 'px';
    }

    function toggleDark() {
        document.getElementById('body').classList.toggle('dark-mode');
    }

    function resetAll() {
        if(confirm("هل تريد إغلاق الملف الحالي؟")) {
            viewer.style.display = 'none';
            toolbar.style.display = 'none';
            fileNameDiv.style.display = 'none';
            uploadArea.style.display = 'block';
            document.getElementById('fileInput').value = '';
            document.getElementById('body').classList.remove('dark-mode');
        }
    }

    // دعم السحب والإفلات
    uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.style.borderColor = '#27ae60'; });
    uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = '#3498db'; });
    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        processFile(e.dataTransfer.files);
    });
</script>

</body>
</html>
