const LEVEL_NAMES = {
  "1":"الفرقة الأولى",
  "2":"الفرقة الثانية",
  "3":"الفرقة الثالثة",
  "4":"الفرقة الرابعة"
};

function getUser(){
  const raw = localStorage.getItem("mw_user");
  if(!raw) return null;
  try{
    const user = JSON.parse(raw);
    if(!user || user.success !== true) return null;
    return user;
  }catch(e){
    return null;
  }
}

function getLevel(user){
  return String(user.level ?? user.Level ?? user.year ?? user.grade ?? "").trim();
}

function getSpec(user){
  return String(user.specialization ?? user.spec ?? "").trim();
}

function isTrade(user){
  const s = getSpec(user).toLowerCase().replace(/\s+/g, "");
  return s.includes("trade") || s.includes("خارج");
}

function specLabel(user){
  return isTrade(user) ? " — تخصص التجارة الخارجية" : "";
}

function booksKey(user, level){
  return isTrade(user) ? level + "_trade" : level;
}

function addButton(book, isFirst){
  const btn = document.createElement("button");
  btn.textContent = book.title;
  btn.onclick = function(){
    changeFile(book.file, btn);
  };
  if(isFirst) btn.classList.add("active");
  return btn;
}

function renderBooks(level, key){
  const list = document.getElementById("bookList");
  list.innerHTML = "";

  const books = (BOOKS[key] && BOOKS[key].length) ? BOOKS[key] : (BOOKS[level] || []);

  if(!books.length){
    document.getElementById("reader").style.display = "none";
    document.getElementById("empty").style.display = "flex";
    document.getElementById("emptyText").textContent =
      LEVEL_NAMES[level] + " موجودة في النظام، لكن لم تتم إضافة ملفات كتبها إلى Reader بعد.";
    return;
  }

  let currentSection = "";
  let first = true;

  books.forEach(book => {
    if(book.section !== currentSection){
      currentSection = book.section;
      const label = document.createElement("div");
      label.className = "section-label";
      label.textContent = currentSection;
      list.appendChild(label);
    }
    list.appendChild(addButton(book, first));
    first = false;
  });

  document.getElementById("reader").style.display = "flex";
  showFile(books[0].file);
}

let currentRenderTask = 0;

async function renderPDF(url, container) {
  const renderId = ++currentRenderTask;
  container.innerHTML = '<div class="pdf-status">⏳ جاري تحميل صفحات الكتاب...</div>';

  try {
    const loadingTask = pdfjsLib.getDocument(url);
    const pdf = await loadingTask.promise;
    if (renderId !== currentRenderTask) return;

    container.innerHTML = "";
    const containerWidth = container.clientWidth - 30;

    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      if (renderId !== currentRenderTask) return;

      const page = await pdf.getPage(pageNum);
      const unscaledViewport = page.getViewport({ scale: 1 });
      // ضبط العرض تلقائياً ليناسب شاشة الكمبيوتر أو الموبايل بدقة عالية
      const scale = Math.min((containerWidth > 200 ? containerWidth : 800) / unscaledViewport.width, 2.0);
      const viewport = page.getViewport({ scale: scale });

      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");
      const outputScale = window.devicePixelRatio || 1;

      canvas.width = Math.floor(viewport.width * outputScale);
      canvas.height = Math.floor(viewport.height * outputScale);
      canvas.style.width = Math.floor(viewport.width) + "px";
      canvas.style.height = Math.floor(viewport.height) + "px";

      container.appendChild(canvas);

      const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;
      await page.render({
        canvasContext: context,
        transform: transform,
        viewport: viewport
      }).promise;
    }
  } catch (err) {
    if (renderId !== currentRenderTask) return;
    console.error("PDF Error:", err);
    container.innerHTML = '<div class="pdf-status">⚠️ تعذر تحميل الملف. تأكد من وجود ملف الـ PDF في نفس المجلد وتطابق اسمه:<br><br><b>' + decodeURI(url) + '</b></div>';
  }
}

function showFile(fileName){
  const pdfContainer = document.getElementById("pdf-container");
  const video = document.getElementById("video-viewer");
  const isVideo = /\.mp4$/i.test(fileName);
  const encodedUrl = encodeURI(fileName);

  if(isVideo){
    currentRenderTask++; // إيقاف أي تحميل PDF جاري
    pdfContainer.style.display = "none";
    pdfContainer.innerHTML = "";

    video.style.display = "block";
    video.pause();
    video.innerHTML = "";
    const source = document.createElement("source");
    source.src = encodedUrl;
    source.type = "video/mp4";
    video.appendChild(source);
    video.load();
  }else{
    video.pause();
    video.style.display = "none";
    video.innerHTML = "";

    pdfContainer.style.display = "flex";
    pdfContainer.scrollTop = 0;
    renderPDF(encodedUrl, pdfContainer);
  }
}

function changeFile(fileName, btn){
  showFile(fileName);
  document.querySelectorAll("#bookList button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

function logout(){
  localStorage.removeItem("mw_user");
  location.replace("login.html");
}

function start(){
  const user = getUser();

  if(!user){
    document.getElementById("loading").style.display = "none";
    document.getElementById("denied").style.display = "flex";
    return;
  }

  const level = getLevel(user);

  if(!["1","2","3","4"].includes(level)){
    document.getElementById("loading").style.display = "none";
    document.getElementById("denied").style.display = "flex";
    document.getElementById("deniedText").textContent =
      "حسابك لا يحتوي على فرقة دراسية صحيحة.";
    return;
  }

  document.getElementById("loading").style.display = "none";
  document.getElementById("studentInfo").textContent =
    "👤 " + (user.name || user.username || "الطالب") +
    " — " + LEVEL_NAMES[level] + specLabel(user);

  renderBooks(level, booksKey(user, level));
}

start();
