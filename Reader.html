<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مستعرض المحاسبة المتوسطة (2)</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #2c3e50; }
        header { background: #1a252f; color: white; padding: 10px 20px; text-align: center; height: 40px; line-height: 40px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .main-container { display: flex; height: calc(100vh - 60px); }
        nav { width: 320px; background: #34495e; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-left: 2px solid #2c3e50; overflow-y: auto; }
        .section-label { color: #1abc9c; font-weight: bold; margin-top: 10px; font-size: 0.9em; border-bottom: 1px solid #1abc9c; padding-bottom: 5px; }
        nav button { background: #455a64; color: white; border: none; padding: 12px; cursor: pointer; text-align: right; border-radius: 5px; font-size: 14px; transition: 0.3s; }
        nav button:hover { background: #1abc9c; }
        nav button.active { background: #e67e22; font-weight: bold; }
        .viewer { flex-grow: 1; background: #ecf0f1; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<header>
    🎓 منصة التعلم الذاتي: المحاسبة المتوسطة (2) - Walid & Spider
</header>

<div class="main-container">
    <nav>
        <div class="section-label">المحاسبة المتوسطة (2)</div>
        <button onclick="changeFile('محاسبة متوسطة (2) اساسيات + الفصل الاول عملى.pdf', this)" class="active">
            📖 الأساسيات + الفصل الأول (عملي) [cite: 3, 75]
        </button>
        <button onclick="changeFile('المحاسبة المتوسطة 2 spider &  نطرىwalid.pdf', this)">
            📝 شرح القيود والتمارين (نظري + عملي) [cite: 132, 144]
        </button>
    </nav>

    <div class="viewer">
        <iframe id="pdf-viewer" src="محاسبة متوسطة (2) اساسيات + الفصل الاول عملى.pdf"></iframe>
    </div>
</div>

<script>
    function changeFile(fileName, btn) {
        document.getElementById('pdf-viewer').src = fileName;
        const buttons = document.querySelectorAll('nav button');
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
</script>
<style>
    body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
    .main-container { display: flex; height: calc(100vh - 60px); }
    nav { width: 300px; background: #1e293b; padding: 15px; overflow-y: auto; }
    .section-label { color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 10px; }
    nav button { 
        width: 100%; background: #334155; color: #f8fafc; border: none; 
        padding: 15px; margin-bottom: 8px; border-radius: 12px; 
        text-align: right; cursor: pointer; transition: 0.3s; display: flex; align-items: center;
    }
    nav button:hover { background: #475569; transform: translateX(-5px); }
    nav button.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
    .viewer { flex-grow: 1; border-right: 2px solid #ddd; }
    @media (max-width: 768px) {
        .main-container { flex-direction: column; }
        nav { width: 100%; height: 200px; }
    }
</style>
</body>
</html>
