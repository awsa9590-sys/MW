<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مستعرض الفصول التعليمية</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #2c3e50; }
        
        /* تصميم الهيدر */
        header { 
            background: #1a252f; color: white; padding: 10px 20px; 
            text-align: center; height: 40px; line-height: 40px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* حاوية المحتوى الرئيسي */
        .main-container { display: flex; height: calc(100vh - 60px); }

        /* القائمة الجانبية */
        nav { 
            width: 250px; background: #34495e; padding: 20px; 
            display: flex; flex-direction: column; gap: 10px;
            border-left: 1px solid #2c3e50;
        }

        nav button {
            background: #1abc9c; color: white; border: none; padding: 12px;
            cursor: pointer; text-align: right; border-radius: 5px;
            font-size: 14px; transition: background 0.3s;
        }

        nav button:hover { background: #16a085; }
        nav button.active { background: #e67e22; }

        /* منطقة العرض */
        .viewer { flex-grow: 1; background: #ecf0f1; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<header>
    📑 المكتبة الرقمية: عرض الفصول الدراسية
</header>

<div class="main-container">
    <nav>
        <button onclick="changeFile('الفصل الاول ريادة اعمال.pdf', this)" class="active">
            📙 الفصل الأول: ريادة الأعمال
        </button>
        <button onclick="changeFile('الفصل الاول موارد بشريه.pdf', this)">
            📘 الفصل الأول: موارد بشرية
        </button>
    </nav>

    <div class="viewer">
        <iframe id="pdf-viewer" src="الفصل الاول ريادة اعمال.pdf"></iframe>
    </div>
</div>

<script>
    function changeFile(fileName, btn) {
        // تغيير ملف الـ PDF
        document.getElementById('pdf-viewer').src = fileName;
        
        // تحديث حالة الأزرار
        const buttons = document.querySelectorAll('nav button');
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
</script>

</body>
</html>
