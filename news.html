<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src https://script.google.com https://script.googleusercontent.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<script src="auth.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHAMED WALID | مركز الأخبار والتنبيهات</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .news-badge {
            background: #e74c3c;
            color: white;
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 20px;
            margin-right: 10px;
        }
        .news-date {
            color: #777;
            font-size: 14px;
            display: block;
            margin-top: 5px;
        }
        .news-item {
            border-right: 5px solid #005aaa;
            text-align: right;
            margin-bottom: 20px;
        }
        .loading {
            text-align: center;
            font-size: 20px;
            color: #005aaa;
            padding: 30px;
        }
    </style>
</head>
<body>
    <script>
        (function () {
            const savedUser = localStorage.getItem("mw_user");
            if (!savedUser) {
                window.location.replace("login.html");
                return;
            }
            try {
                const user = JSON.parse(savedUser);
                if (!user || user.success !== true) {
                    localStorage.removeItem("mw_user");
                    window.location.replace("login.html");
                }
            } catch (error) {
                localStorage.removeItem("mw_user");
                window.location.replace("login.html");
            }
        })();
    </script>

    <header>
        <h1>📢 مركز الأخبار والتنبيهات</h1>
        <nav style="margin-top: 15px;">
            <a href="index.html"><i class="fa-solid fa-house"></i> الرئيسية</a>
            <a href="Exercise.html"><i class="fa-solid fa-laptop-code"></i> بنك الأسئلة</a>
            <a href="Reader.html"><i class="fa-solid fa-book-open"></i> الملخصات</a>
            <a href="news.html" style="text-decoration: underline;"><i class="fa-solid fa-bullhorn"></i> الأخبار</a>
        </nav>
    </header>

    <section class="hero">
        <h2>🚀 متابعة أحدث القرارات والمواعيد</h2>
        <p>كل الإعلانات المدرسية والمستجدات في مكان واحد</p>
    </section>

    <!-- حاوية عرض الأخبار -->
    <section class="container" id="newsContainer">
        <div class="loading">
            <i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل أحدث الأخبار...
        </div>
    </section>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzdUb9zZW7J_KRbEPxVnDoIvs7YgCIrvTxXskOtXQc6iKF2GYdQR_S3lSNeieEI7sQbfQ/exec";

        async function fetchNews() {
            const container = document.getElementById("newsContainer");
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const newsList = await response.json();
                if (!Array.isArray(newsList)) throw new Error("bad response");

                // 🔴 حفظ الإجمالي الجديد لتصفير النقطة الحمراء عند الدخول
                localStorage.setItem("mw_read_news_count", newsList.length.toString());

                if (newsList.length === 0) {
                    container.innerHTML = "<p style='text-align:center;'>لا توجد أخبار حالياً.</p>";
                    return;
                }

                container.innerHTML = ""; // تفريغ رسالة التحميل

                // العرض بالترتيب العكسي (الخبر الأحدث أولاً)
                newsList.reverse().forEach(news => {
                    const card = document.createElement("div");
                    card.className = "card news-item";

                    const h3 = document.createElement("h3");
                    const badge = document.createElement("span");
                    badge.className = "news-badge";
                    badge.textContent = String(news.badge ?? "");
                    h3.appendChild(badge);
                    h3.appendChild(document.createTextNode(" " + String(news.title ?? "")));

                    const dateEl = document.createElement("span");
                    dateEl.className = "news-date";
                    const icon = document.createElement("i");
                    icon.className = "fa-regular fa-calendar-alt";
                    dateEl.appendChild(icon);
                    dateEl.appendChild(document.createTextNode(" " + String(news.date ?? "")));

                    const p = document.createElement("p");
                    p.textContent = String(news.content ?? "");

                    card.appendChild(h3);
                    card.appendChild(dateEl);
                    card.appendChild(p);

                    // السماح بروابط http/https فقط (منع javascript: وغيرها)
                    if (news.link) {
                        try {
                            const u = new URL(String(news.link), location.href);
                            if (u.protocol === "https:" || u.protocol === "http:") {
                                const a = document.createElement("a");
                                a.href = u.href;
                                a.className = "btn";
                                a.target = "_blank";
                                a.rel = "noopener noreferrer";
                                a.textContent = "الانتقال للرابط";
                                card.appendChild(a);
                            }
                        } catch (e) {}
                    }
                    container.appendChild(card);
                });

            } catch (error) {
                container.innerHTML = "<p style='text-align:center; color:red;'>حدث خطأ أثناء تحميل الأخبار، يرجى المحاولة لاحقاً.</p>";
            }
        }

        fetchNews();
    </script>
</body>
</html>
