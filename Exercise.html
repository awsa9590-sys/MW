<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة اختبارات المحاسبة المتوسطة</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --primary: #38bdf8;
            --secondary: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .selector-box {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid #334155;
        }

        select {
            background: #0f172a;
            color: var(--text-main);
            border: 2px solid var(--primary);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            width: 100%;
            max-width: 400px;
            outline: none;
            cursor: pointer;
        }

        .q-card {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            transition: 0.3s;
        }

        .q-header {
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .q-num {
            background: var(--primary);
            color: #000;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-left: 10px;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .opt-label {
            background: #334155;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .opt-label:hover { background: #475569; }

        input[type="radio"] {
            margin-left: 15px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .opt-label.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .opt-label.wrong { border-color: var(--danger); background: rgba(239, 68, 68, 0.15); color: var(--danger); }

        .btn-submit {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }

        #finalResult {
            display: none;
            text-align: center;
            padding: 30px;
            background: var(--bg-card);
            border-radius: 20px;
            margin-bottom: 30px;
            border: 2px solid var(--primary);
        }
    </style>
</head>
<body>

<div id="accessDenied" style="display:none;max-width:850px;margin:80px auto;text-align:center;background:var(--bg-card);padding:40px;border-radius:20px;border:1px solid #334155;">
    <div style="font-size:60px;">🔒</div>
    <h2 id="deniedTitle">تسجيل الدخول مطلوب</h2>
    <p id="deniedText" style="color:var(--text-muted);">يجب تسجيل الدخول لفتح بنك الأسئلة.</p>
    <button class="btn-submit" style="max-width:400px;" onclick="location.href='login.html'">تسجيل الدخول</button>
</div>

<div id="quizApp" class="container" style="display:none;">
    <header>
        <h1>منصة الاختبارات الذكية</h1>
        <p style="color: var(--text-muted)">المحاسبة المتوسطة (2)</p>
    </header>

    <div class="selector-box">
        <label style="display: block; margin-bottom: 10px;">اختر المادة / الفصل الدراسي:</label>
        <select id="chapterSelect" onchange="changeChapter()"></select>
        <div id="studentLevel" style="margin-top:10px;color:var(--text-muted);font-size:.95rem;"></div>
        <button type="button" onclick="logout()" style="
            margin-top:14px;padding:10px 20px;border:0;border-radius:10px;
            background:#ef4444;color:#fff;cursor:pointer;font-weight:bold;">
            🚪 تسجيل الخروج
        </button>
    </div>

    <div id="imgContainer" style="display: none; text-align: center; margin: 20px 0;">
        <p id="imgLabel" style="margin-bottom: 15px; font-size: 1.1rem; color: #38bdf8; font-weight: bold;">
            📊 الصورة المرجعية للحالة العملية (ديوان عام محافظة القاهرة):
        </p>
        <img src="WhatsApp Image 2026-03-06 at 1.35.53 AM.jpeg" 
             id="refImage" 
             alt="بيانات الأجور والاستقطاعات" 
             style="width: 100%; max-width: 600px; border: 3px solid #38bdf8; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
    </div>

    <div id="finalResult"></div>

    <form id="quizForm">
        <div id="quizContainer"></div>
        <button type="button" class="btn-submit" onclick="gradeQuiz()">عرض النتيجة النهائية</button>
    </form>
</div>

        ch41: [

            { q: "من خصائص النظام أنه لا يجوز دراسة كل عنصر من عناصره بمعزل عن العناصر الأخرى بسبب وجود:", a: 1, opts: ["حدود صلبة", "علاقات تبادلية بين عناصر النظام", "مخرجات ثابته", "عدم مرونة النظام"], f: "تتميز عناصر النظام بوجود علاقات تبادلية فيما بينها تمنع دراسة كل عنصر بمعزل عن الآخر." },
            { q: "تخضع العلاقات المتبادلة بين عناصر النظام لقوانين منطقية ورياضية يمكن تحديدها في ضوء:", a: 0, opts: ["تكوين النظام الداخلي ونوعية مدخلاته", "سرعة المعالجة الإلكترونية", "نوع المستفيدين", "حجم التقرير النهائي"], f: "يتم تحديد القوانين المنطقية والرياضية للعلاقات المتبادلة بناءً على تكوين النظام الداخلي ونوعية مدخلاته." },
            { q: "المرحلة التي تتضمن إزالة القيم المفقودة أو المكررة وتصحيح الأخطاء ضمن مراحل المعالجة هي:", a: 1, opts: ["جمع البيانات", "تنظيف وتحويل البيانات", "الفرز والتجميع", "إعداد التقارير"], f: "تنظيف البيانات يشمل إزالة القيم المفقودة/المكررة وتصحيح الأخطاء وتحويلها لتنسيق رقمي مناسب." },
            { q: "تُعرف الحقائق المجردة التي لا تصلح لاتخاذ القرار وتعتبر المادة الخام بأنها:", a: 2, opts: ["المعلومات (Information)", "المعالجة (Processing)", "البيانات (Data)", "التقارير (Reports)"], f: "البيانات هي الحقائق المجردة الخالية من التنسيق وتعتبر المادة الخام لإنتاج المعلومات." },
            { q: "من مزايا تكنولوجيا المعلومات مقارنة بنظم المعلومات اليدوية التقليدية:", a: 0, opts: ["السرعة، الدقة، الكفاءة، الجودة والاعتمادية", "بطء المعالجة زيادة الأمان", "الاعتماد التام على الموارد البشرية", "تقليل مرونة النظام"], f: "تتفوق تكنولوجيا المعلومات بالسرعة والدقة والكفاءة ومستويات عالية من الجودة والاعتمادية." },
            { q: "يُسمى النظام الذي يتكون من العناصر المتفاعلة (العمليات) اللازمة لتحويل البيانات إلى معلومات بـ:", a: 1, opts: ["نظام المعالجة اليدوية", "نظام المعلومات", "التغذية الراجعة", "الهيكل التنظيمي"], f: "نظام المعلومات هو النظام المتكون من عناصر متفاعلة لتحويل البيانات إلى معلومات ملبية للاحتياجات." },
            { q: "المحور الأساسي للاختلاف بين نظم المعلومات اليدوية ونظم المعلومات الإلكترونية يكمن في:", a: 1, opts: ["دورة إنتاج المعلومات (I/P/O Cycle)", "استخدام أو عدم استخدام تكنولوجيا المعلومات", "أهداف النظام العامة", "مدخلات النظام الأساسية"], f: "كلا النوعين يطبقان نفس دورة إنتاج المعلومات، والاختلاف الجوهري هو في استخدام تكنولوجيا المعلومات من عدمه." },
            { q: "المرحلة الأخيرة من مراحل عملية معالجة البيانات والتي يتم فيها عرض البيانات المعالجة في شكل جداول ورسوم بيانية هي:", a: 2, opts: ["الفرز والتجميع", "التحليل", "إعداد التقارير", "جمع البيانات"], f: "إعداد التقارير هو المرحلة النهائية لعرض البيانات المعالجة لاتخاذ قرارات مستنيرة." },
            { q: "العلاقات هي مجموعة من المكونات التي تشكل النظام وبيئته.", a: 1, opts: ["صواب", "خطأ"], f: "خطأ، المكونات التي تشكل النظام وبيئته هي (النظم الفرعية)، أما العلاقات فهي الربط بين هذه النظم." },
            { q: "النظام ليس مجموع مكونات أو عناصر فقط، بل هو أيضاً العلاقات التي تربط بين المكونات مع بعضها.", a: 0, opts: ["صواب", "خطأ"], f: "صواب، النظام يشمل المكونات والعلاقات والتفاعل القائم بينها ضمن نسق وتصميم معين." },
            { q: "تتصف المعلومات بأنها غير منظمة وتأتي في صيغ متعددة مثل النصوص والأرقام والأصوات قبل معالجتها.", a: 1, opts: ["صواب", "خطأ"], f: "خطأ، هذه الخصائص تصف (البيانات Data)، أما المعلومات فهي نتاج معالجة البيانات وتكون منظمة وذات معنى." },
            { q: "يختلف نظام المعلومات اليدوي عن الإلكتروني في تطبيق دورة إنتاج المعلومات (I/P/O Cycle).", a: 1, opts: ["صواب", "خطأ"], f: "خطأ، كلاهما يطبقان نفس دورة إنتاج المعلومات (Input / Process / Output)." },
            { q: "تتوقف كفاءة المعلومات على جودة ودقة العمليات التي تجرى عليها أثناء المعالجة.", a: 0, opts: ["صواب", "خطأ"], f: "صواب، كفاءة المعلومات تتأثر بشكل مباشر بدقة وجودة خطوات المعالجة المُنفذة." },
            { q: "تقتصر مساندة نظم المعلومات لمتخذي القرار على تقديم التقارير فقط.", a: 1, opts: ["صواب", "خطأ"], f: "خطأ، تساند نظم المعلومات العاملين بأمرين: تقديم التقارير، ومساندة الإدارة العليا على المستوى الاستراتيجي والتنفيذي." },
            { q: "مرحلة التحليل ضمن مراحل المعالجة تتضمن استخدام الخوارزميات الإحصائية أو نماذج التعلم الآلي لاستخراج الأنماط.", a: 0, opts: ["صواب", "خطأ"], f: "صواب، تعتمد مرحلة التحليل على الصيغ والتقنيات التحويلية ونماذج الذكاء الاصطناعي لاستخلاص المعرفة." },
            { q: "تُعرف النظم الفرعية بأنها العناصر المحيطة بالنظام والتي لا تكون جزءاً منه ولكنها تؤثر أو تتأثر به.", a: 1, opts: ["صواب", "خطأ"], f: "خطأ، هذا هو تعريف (بيئة النظام). أما النظم الفرعية فهي العناصر والمكونات الداخلية التي تشكل النظام." },
            { q: "تمثل المعلومات الأساس الضروري لعملية اتخاذ القرارات على المستويات الإدارية المختلفة ويجب أن تتصف بالسرعة والدقة.", a: 0, opts: ["صواب", "خطأ"], f: "صواب، اتخاذ القرار يتطلب معلومات سريعة، دقيقة، وفي الوقت والشكل المناسب." },
            { q: "من خصائص النظام عدم قابليته للمراجعة والتطوير أو المرونة بعد تصميمه.", a: 1, opts: ["صواب", "خطأ"], f: "خطأ، من الخصائص الرئيسية لأي نظام نِشِط هي المرونة والقابلية للمراجعة والتطوير." }
        ],
        ch42:[
            {q: "يُعرف النظام بأنه مجموعة من العناصر والنظم الفرعية التي تربط بينها علاقات منتظمة في بيئة معينة لتحقيق:",a: 2,opts: ["العمل المالي المستقل", "التكاليف فقط", "أهداف محددة", "كفاءة فردية فقط"],f: "بناءً على المادة العلميّة، يُعرف النظام بأنه مجموعة من النظم الفرعية التي تربط بينها علاقة ببعضها في بيئة معينة ومنظمة بهدف تحقيق أهداف محددة.[cite: 127]."},
  {q: "تُعرف المادة الخام غير المنظمة التي تتكون من حقائق وأرقام ولا تصلح لاتخاذ القرار مباشرة بـ:",a: 2,opts: ["المعلومات", "المعرفة", "البيانات", "التقرير النهائي"],f: "البيانات هي حقائق مجردة غير منظمة تمثل المادة الخام لإنتاج المعلومات[cite: 131]."},
  {q: "النتاج المباشر لعمليات معالجة وتنسيق البيانات الخام ليصبح لها معنى وفائدة يسمى:",a: 2, opts: ["البيانات", "المدخلات", "المعلومات", "النظم الفرعية"], f: "المعلومات هي نتاج معالجة وتنسيق البيانات الخام لتصبح ذات معنى وفائدة لاتخاذ القرار[cite: 131]."},
  {q: "تُعد صعوبة عمليات البحث والاسترجاع والبطء الشديد والتعرض للسهو والخطأ من أبرز عيوب:",a: 2, opts: ["نظم المعلومات الإلكترونية", "نظم إدارة قواعد البيانات", "نظم المعلومات اليدوية", "شبكات الإنترنت"],f: "تتسم نظم المعلومات اليدوية بالبطء الشديد، وعدم المرونة، وصعوبة الاسترجاع، وعرضتها للسهو والخطأ[cite: 134]."},
  {q: "المكون الذي يشمل الأجهزة الملموسة في الحاسب مثل لوحة المفاتيح والماسحات الضوئية والطابعات هو:",a: 1,opts: ["Software", "Hardware", "Procedures", "Databases"],f: "الأجهزة والمعدات المادية (Hardware) تمثل المكونات المادية الملموسة لنظام المعلومات[cite: 137, 138]."},
  {q: "النظم التي تقوم بإنشاء وتعريف وتعديل قواعد البيانات وتلبية احتياجات المستخدمين منها مثل برنامج (Access) تُعرف بـ:", a: 2,opts: ["تكنولوجيا الاتصالات", "المكون المادي", "نظم إدارة قواعد البيانات (DBMS)", "البرمجيات التطبيقية الجاهزة"], f: "نظم إدارة قواعد البيانات (DBMS) تقوم بإنشاء وتعريف قاعدة البيانات وتلبية احتياجات المستخدمين مثل Access[cite: 138]."},
  {q: "السلسلة المنظمة والمتسلسلة من الخطوات الثابتة الواجب اتباعها لإنجاز مهمة معينة داخل النظام هي:",a: 0,opts: ["الإجراءات والعمليات", "الأجهزة والعتاد", "العنصر البشري", "التغذية الراجعة"],f: "الإجراءات والعمليات هي مجموعة منظمة ومتسلسلة من الخطوات الثابتة لإنجاز مهمة أو هدف محدد[cite: 139]."},
  {q: "خاصية النظام التي تُعبر عن مطابقة البيانات للواقع الفعلي واتساقها وصحتها عبر أجزاء النظام مع مرور الوقت هي:",a: 2, opts: ["التغذية الراجعة", "المرونة", "الدقة والموثوقية", "الأتمتة"], f: "الدقة تعني مطابقة البيانات للواقع، بينما الموثوقية تعني اتساقها وصحتها عبر أجزاء النظام ومع مرور الوقت[cite: 143, 144]." },
  {q: "استخدام مخرجات النظام كمدخلات لعمليات اتخاذ القرارات المستقبلية للحفاظ على استقرار أداء النظام أو تحسينه يُعرف بـ:",a: 0,opts: ["التغذية الراجعة والتحكم", "الشفافية والمساءلة", "التكامل والتوحيد", "الأتمتة التشغيلية"],f: "التغذية الراجعة والتحكم تستخدم المخرجات كمدخلات للقرارات المستقبلية لضمان استقرار النظام ودقته[cite: 146]." },
  {q: "الخاصية التي تعني إمكانية تعديل وتطوير النظام لمواكبة التغيرات والتطورات البيئية الداخلية والخارجية هي:", a: 1, opts: ["البساطة", "المرونة", "السرعة", "التنسيق اليدوي"], f: "المرونة تعني إمكانية تطوير النظام وتعديله بما يتلاءم مع التغيرات والاحتياجات الجديدة في البيئة[cite: 146]." },
  {q: "هل يجوز دراسة كل عنصر من عناصر النظام بمعزل عن العناصر الأخرى دون النظر للعلاقات التبادلية بينها؟", a: 1, opts: ["نعم يجوز", "لا يجوز", "يُفضل أحياناً", "حسب رغبة الإدارة"], f: "لا يجوز دراسة كل عنصر بمعزل عن العناصر الأخرى لوجود علاقات تبادلية بين عناصر النظام[cite: 128]."},
  {q: "تتكون دورة إنتاج المعلومات الأساسية (I/O Cycle) من:",a: 0,opts: ["البيانات، العمليات، المعلومات", "التخطيط، التنفيذ، الرقابة", "الأجهزة، البرامج، الأفراد", "المدخلات فقط"],f: "تتكون دورة إنتاج المعلومات من المدخلات (البيانات)، العمليات (المعالجة)، والمخرجات (المعلومات)[cite: 130, 134]."},
  {q: "أي الأنظمة التالية تتفوق تفوقاً كبيراً في السرعة والدقة والقدرة على النسخ الاحتياطي؟",a: 1,opts: ["نظم المعلومات اليدوية", "نظم المعلومات الإلكترونية", "السجلات الورقية", "الأرشيف اليدوي"],f: "نظم المعلومات الإلكترونية تتفوق في السرعة والدقة والكفاءة والاعتمادية مقارنة بالنظم اليدوية[cite: 133]."},
  {q: "يضم مفهوم العنصر البشري (People) في نظم المعلومات الإلكترونية:", a: 2, opts: ["المبرمجين ومشغلي الحاسب فقط", "المسؤولين الإداريين فقط", "جميع المستخدمين النهائيين كالمحاسب والمدير والعميل", "مهندسي الصيانة فقط"], f: "العنصر البشري يشمل المستخدم النهائي كالمشغل، المبرمج، المهندس، المحاسب، المدير، وربما العميل العادي[cite: 137]."},
  {q: "من المكونات غير الملموسة في نظم المعلومات الإلكترونية والتي توجّه الأجهزة لتنفيذ العمليات:", a: 1,opts: ["الأجهزة والمعدات (Hardware)", "برامج الحاسب (Software)", "قواعد البيانات الفيزيائية", "شبكات الاتصال المادية"],f: "البرمجيات (Software) هي مجموعة من التعليمات غير الملموسة التي تخبر الأجهزة بما يجب القيام به[cite: 138]."},
  {q: "تعني خاصية \"تكامل العناصر\" (Integration) في نظم المعلومات أن:", a: 0, opts: ["مخرجات نظام فرعي تعتبر مدخلات لنظام آخر والعكس", "استقلال كل نظام فرعي تماماً عن الآخر", "إلغاء النظم الفرعية بالكامل", "تكرار البيانات في كل الأقسام"], f: "تكامل الأنظمة الفرعية يعني أن نشاط أي نظام فرعي مكمل للآخر؛ فمخرجات قسم التسويق مثلاً هي مدخلات للخدمات والمالية[cite: 145]."},
  {q: "ماذا تعني الشفافية والمساءلة في نظم المعلومات الإلكترونية؟",a: 1, opts: ["تشفير جميع البيانات ومنع وصول الموظفين لها", "جعل البيانات والقرارات واضحة ومتاحة مع وجود آليات لقياس الأداء ومحاسبة المسؤولين", "اقتصار المعلومات على الإدارة العليا فقط", "إخفاء تقارير الأداء عن أصحاب المصلحة"],f: "الشفافية تعني وضوح وإتاحة البيانات والقرارات، والمساءلة تعني وجود آليات لضمان محاسبة الأفراد عن إجراءاتهم[cite: 144]."},
  {q: "يهدف تطبيق أتمتة المهام (التشغيل الآلي) في نظم المعلومات إلى:",a: 1,opts: ["زيادة الجهد اليدوي والأخطاء", "أتمتة المهام المتكررة لزيادة الكفاءة وتقليل الجهد اليدوي والأخطاء", "إبطاء العمليات التشغيلية", "زيادة التكاليف التشغيلية والورقيات"],f: "الأتمتة تستخدم لأتمتة المهام المتكررة مثل إدخال البيانات مما يزيد الكفاءة ويقلل الجهد اليدوي[cite: 135, 148]."},
  {q: "تقع شبكات مثل الشبكة المحلية (LAN) وشبكة الإنترنت ضمن أي من عناصر نظم المعلومات الإلكترونية؟",a: 1,opts: ["قواعد البيانات", "تكنولوجيا الاتصالات", "الإجراءات والعمليات", "المكونات المادية للأجهزة فقط"],f: "تكنولوجيا الاتصالات تشمل شبكات الحاسب مثل الشبكات المحلية LAN، والشبكات الإقليمية، والإنترنت[cite: 139]."},
  {q: "ما مصير النظام غير المرن الذي لا يتطور مع التغيرات البيئية الداخلية والخارجية؟", a: 1, opts: ["تكتب له الاستمرارية والنجاح", "لن تكتب له الاستمرارية وفقدان القدرة على تلبية المتطلبات", "يزيد من كفاءة واتخاذ القرارات", "يصبح أكثر استقراراً ودقة"],f: "النظام غير المرن الذي لا يتطور لا تكتب له الاستمرارية ولا يستطيع الوفاء بالتزاماته ومتطلباته[cite: 146]." }
        ],
        ch43:[
    {q: "القضية الأساسية في المعالجة المحاسبية للمخزون وفقاً لمعيار المحاسبة المصري رقم (2) هي:", a: 1, opts: ["تحديد طرق البيع والتسويق وتوزيع المنتجات.", "تحديد التكلفة التي يتم إثبات المخزون بها كأصل وترحل من فترة إلى أخرى لحين تحقق الإيراد المقابل لها.", "حساب إجمالي أرباح المنشأة وتوزيعاتها.", "تحديد التكاليف الثابتة للطاقة العاطلة للمصانع."], f: "التكلفة التي يثبت بها المخزون كأصل وترحل لحين تحقق الإيراد هي القضية الأساسية للمعالجة." },
    {    q: "أي من العناصر الآتية يُستبعد تماماً من تكلفة المخزون في المنشآت الصناعية والتجارية؟",    a: 2,    opts: ["تكلفة الشراء والرسوم الجمركية غير المستردة.", "تكاليف النقل والمناولة المباشرة لاقتناء المواد الخام.", "تكلفة الفاقد غير الطبيعي في المواد والعمالة وتكاليف الإنتاج الأخرى.", "تكاليف التشكيل (التحويل) المتغيرة والثابتة."],     f: "يستبعد الفاقد غير الطبيعي وتكاليف التخزين غير الضرورية والمصروفات الإدارية من تكلفة المخزون."   },
    {    q: "في المنشآت الخدمية، تتكون تكلفة المخزون بصفة أساسية من:",    a: 0,     opts: ["تكاليف العمالة والموظفين القائمين مباشرة على تقديم الخدمة والمشرفين والمصروفات غير المباشرة المتعلقة بتلك الخدمة.", "تكاليف عمالة وموظفي البيع والعمالة الإدارية.", "هوامش الربح والتكاليف الإدارية غير المتعلقة بتقديم الخدمة.", "جميع ما ذكر خطأ."],     f: "تتكون تكلفة المخزون الخدمي من عمالة وموظفي تقديم الخدمة مباشرة والمصروفات غير المباشرة لها."  },
    {   q: "تُستخدم طريقة 'التمييز المحدد للتكلفة' لحساب تكلفة المخزون مع:",     a: 1,    opts: ["بنود المخزون المتجانسة وسريعة التغير في محلات تجارة التجزئة.", "بنود المخزون المميزة أو المحددة بذاتها التي لا تحل محل بنود أخرى أو المنتجة لربطها بمشروعات معينة.", "المواد الخام المنتجة بكميات كبيرة على أساس متكرر.", "المخزون المقاس بأسلوب سعر التجزئة."],    f: "تستخدم طريقة التمييز المحدد للبضائع والخدمات غير القابلة للتبادل أو المنتجة لمشروعات معينة."  },
    {    q: "تُحسب 'صافي القيمة البيعية' للمخزون وفقاً للمعادلة الآتية:",    a: 1,    opts: ["السعر التقديري لبيع المخزون + (التكلفة التقديرية للإتمام + تكاليف إتمام البيع).", "السعر التقديري لبيع المخزون - (التكلفة التقديرية للإتمام + تكاليف إتمام البيع).", "إجمالي تكلفة الشراء الفعلية - تكاليف التشكيل.", "سعر التجزئة مخصوماً منه هامش الربح الإجمالي."],   f: "صافي القيمة البيعية = السعر التقديري للبيع ناقصاً (التكلفة التقديرية للإتمام + تكاليف إتمام البيع)."   },
    {    q: "الأصل في ضوابط تخفيض قيمة المخزون إلى صافي قيمته البيعية أن يتم على أساس:",     a: 1,    opts: ["إجمالي المخزون كوحدة واحدة.", "كل بند (صنف) على حده.", "تبويب المخزون كمجموعة للإنتاج التام فقط.", "قطاع التشغيل أو الصناعة بأكملها."],   f: "الأصل هو تخفيض قيمة المخزون على أساس كل بند (صنف) على حده."   },
    {   q: "أين تعالج المبالغ المرتدة من تخفيضات سبق إجرائها على قيمة المخزون نتيجة زيادة صافي قيمته البيعية في فترة تالية؟",  a: 1,     opts: ["كإيرادات تشغيل أخرى بقائمة الدخل.", "كتخفيض في تكلفة المخزون المباع في الفترة التي تم الرد فيها.", "تضاف مباشرة إلى حقوق الملكية.", "لا تُعالج محاسبياً."],      f: "تعالج المبالغ المرتدة كتخفيض في تكلفة المخزون المباع في فترة الرد."    },
    {     q: "أي من الأساليب الآتية يُستخدم لقياس تكلفة المخزون في منشآت تجارة التجزئة التي تتكون من بنود كثيرة العدد وسريعة التغير وذات هوامش ربحية متماثلة؟",     a: 2,     opts: ["أسلوب التكلفة الفعلية.", "أسلوب التكاليف المعيارية.", "أسلوب سعر التجزئة.", "أسلوب التمييز المحدد."],    f: "يستخدم أسلوب سعر التجزئة في تجارة التجزئة للبند السريعة المتغيرة ذات هوامش الربح المتماثلة." },
    {    q: "وفقاً لطريقة 'الوارد أولاً يصرف أولاً' (FIFO):",    a: 0,    opts: ["البنود التي تبقى في المخازن في نهاية الفترة هي أحدث بنود تم شراؤها أو إنتاجها.", "البنود التي تبقى في المخازن هي أقدم بنود تم شراؤها.", "يتم بيع الوحدات عشوائياً بغض النظر عن تواريخ التوريد.", "تتحدد تكلفة البنود على أساس المتوسط المرجح للتكلفة."],     f: "الوارد أولاً يصرف أولاً يفترض بيع البنود القديمة أولاً وبقاء أحدث البنود بالمخازن."   },
    {     q: "ماذا يجب على المنشأة فعله بالنسبة للمواد الخام المحتفظ بها بغرض الاستخدام في الإنتاج عندما تنخفض أسعارها السوقية؟",     a: 1,      opts: ["تخفض قيمتها دائماً بغض النظر عن أسعار المنتجات التامة.", "لا يتم تخفيض قيمتها إذا كانت المنتجات التامة التي تدخل في تركيبها من المتوقع أن تباع بالتكلفة أو بأعلى منها.", "تُعدل قيمتها فوراً بقيمة تكلفة الإحلال دون شروط.", "تُهمل تماماً ولا تؤخذ في الاعتبار عند إعداد القوائم المالية."],      f: "لا تخفض قيمة المواد الخام إذا كانت منتجاتها التامة ستُباع بالتكلفة أو أعلى منها."   },
    {   q: "تقاس قيمة المخزون - طبقاً لمعيار المحاسبة المصري رقم (2) - بالتكلفة أو القيمة السوقية أيهما أقل.",   a: 1,     opts: ["صحيح", "خطأ"],     f: "خطأ، تقاس بالتكلفة أو صافي القيمة البيعية أيهما أقل."  },
    {    q: "يعترف بالقيمة الدفترية للمخزون المباع كمصروف في نفس الفترة التي يعترف فيها بالإيراد الناتج عن بيعه تطبيقاً لمبدأ المقابلة.",   a: 0,    opts: ["صحيح", "خطأ"],    f: "صحيح، يعترف بالدفترية كمصروف في نفس فترة الإيراد طبقاً لمبدأ المقابلة."   },
    {      q: "يُقصد بتكلفة شراء المخزون سعر الشراء الفعلي من واقع فاتورة الشراء مضافاً إليه الرسوم الجمركية وضرائب الاستيراد غير المستردة وتكاليف النقل والمناولة ومستنزلاً منه الخصم التجاري.",     a: 0,    opts: ["صحيح", "خطأ"],    f: "صحيح، هذا هو التعريف الدقيق لتكلفة الشراء."   },
    {   q: "يجوز تخفيض قيمة أصناف المخزون مجمعة كوحدة واحدة أو قطاع تشغيل معين بدلاً من تقييمها على أساس كل بند على حده.",    a: 1,    opts: ["صحيح", "خطأ"],     f: "خطأ، الأصل التخفيض على أساس كل بند على حده ولا يجوز مجمعة كقطاع تشغيل."  },
    {     q: "تحمل التكاليف الصناعية غير المباشرة الثابتة على المخزون بنسبة الطاقة القصوى للإنتاج بالمنشأة.",     a: 1,     opts: ["صحيح", "خطأ"],     f: "خطأ، تحمل على أساس الطاقة العادية للإنتاج."  },
    {  q: "تُعد التكاليف الصناعية غير المباشرة المتغيرة أحد بنود تكلفة المخزون وتُحمل على كل وحدة إنتاج على أساس الاستخدام الفعلي لطاقة الأصول الإنتاجية.",   a: 0,     opts: ["صحيح", "خطأ"],    f: "صحيح، تحمل المتغيرة على أساس الاستخدام الفعلي." },
    {      q: "تحمل تكلفة التخزين بين المراحل الإنتاجية على المخزون دائماً بغض النظر عن مدى ضرورتها للإنتاج.",    a: 1,     opts: ["صحيح", "خطأ"],     f: "خطأ، تستبعد تكلفة التخزين إلا إذا كانت ضرورية لعملية الإنتاج."  },
    {    q: "أساس احتساب صافي القيمة البيعية للمخزون هو أساس تقديري يعتمد على أفضل الأدلة المتاحة وقت إعداد التقديرات عن القيم المتوقع تحققها.",     a: 0,     opts: ["صحيح", "خطأ"],     f: "صحيح، يعتمد على أفضل الأدلة المتاحة وقت التقدير."  },
    {      q: "تعتبر تكاليف البيع والمصروفات الإدارية التي لا تسهم في الوصول بالمخزون إلى موقعه وحالته الراهنة جزءاً أساسياً من تكلفة المخزون.",     a: 1,      opts: ["صحيح", "خطأ"],      f: "خطأ، تستبعد ولا تدخل ضمن تكلفة المخزون."  },
    {    q: "تحسب التكاليف المعيارية للمخزون على أساس المستويات العادية لاستخدام المواد والمهمات والعمالة ومستوى الكفاءة والطاقة وتتم مراجعتها بصفة دورية.",    a: 0,    opts: ["صحيح", "خطأ"],    f: "صحيح، تحسب على أساس المستويات العادية وتراجع دورياً."  }
],
        ch44:[
    {    q: "الحاجات التي لا تعود بالمنفعة على الفرد وحده بل تعود بالمنفعة على المجتمع ككل هي:",    a: 1,    opts: ["الحاجات الخاصة", "الحاجات العامة أو الاجتماعية", "الحاجات الفردية الشخصية", "حاجات الاستهلاك الخاص"],      f: "الحاجات العامة أو الاجتماعية تعود بالمنفعة على المجتمع ككل مثل الدفاع والأمن والعدالة."  },
    {    q: "وفقاً لقانون ساي للأسواق عند المدرسة الاقتصادية الكلاسيكية:",    a: 1,     opts: ["الطلب هو الذي يخلق العرض", "العرض هو الذي يخلق الطلب", "الاقتصاد لا يتوازن تلقائياً أبداً", "الدولة يجب أن تتدخل دائماً لمعالجة الكساد"],     f: "آدم سميث والتقليديون اعتقدوا أن العرض هو الذي يخلق الطلب المكافئ له." },
    {      q: "أي مما يلي يُعد من أمثلة الحاجات العامة غير القابلة للتجزئة؟",     a: 2,     opts: ["التعليم والصحة", "السكن والملبس", "الأمن والعدالة والدفاع", "المستشفيات الخاصة"],      f: "الأمن والعدالة والدفاع حاجات غير قابلة للتجزئة ولا تقدم إلا من خلال الدولة."   },
    {    q: "وفقاً للرأي الكينزي الحديث، فإن العنصر الأساسي الذي يخلق العرض هو:",      a: 1,      opts: ["العرض المستقل", "الطلب", "الإنتاج المحلي الإجمالي فقط", "المدخرات الشخصية للأفراد"],      f: "أكد كينز على عكس الكلاسيك تماماً، وهو أن الطلب هو الذي يخلق العرض."   },
    {     q: "عُرف علم المالية العامة في الفكر التقليدي بأنه:",     a: 1,     opts: ["العلم الذي يدرس القواعد المنظمة للنشاط المالي لتحقيق أهداف اقتصادية واجتماعية وسياسية", "دراسة النفقات العامة والإيرادات العامة التي تلزم لتغطية هذه النفقات", "العلم الذي يهتم بتعظيم أرباح القطاع الخاص", "دراسة الموازنة القومية وتوقع النشاط الاقتصادي العام"],     f: "اقتصر الفكر التقليدي على دراسة النفقات العامة والإيرادات اللازمة لتغطيتها فقط."   },
    {    q: "في الموازنة العامة للدولة (مقارنة بالمالية الخاصة)، تبدأ الدولة أولاً بـ:",    a: 1,    opts: ["تقدير الإيرادات المتوقعة ثم تحديد أوجه الإنفاق", "تقرير وتقدير أوجه الإنفاق المختلفة ثم تدبير الإيرادات اللازمة لتغطيتها", "الاقتراض الخارجي لتحديد حجم الموازنة", "توزيع الأرباح على الهيئات الحكومية"],   f: "تبدأ الدولة بتقدير أوجه الإنفاق أولاً ثم تدبير الإيرادات اللازمة لتغطيتها على عكس الأفراد."  },
    {   q: "بدأ الكساد العالمي العظيم المذكور في الكتاب والذي استمر لمدة تقارب 5 سنوات في عام:",   a: 1,      opts: ["1917", "1929", "1939", "1945"],     f: "بدأ الكساد العالمي العظيم سنة 1929 واستمر حتى عام 1933."   },
    {     q: "يتكون الطلب الفعال عند \"كينز\" من:",      a: 2,      opts: ["الطلب الاستهلاكي الخاص فقط", "الطلب الاستثماري الخاص فقط", "(الطلب الخاص الاستهلاكي + الطلب الخاص الاستثماري) + الطلب العام الحكومي", "الطلب الحكومي الخالص فقط"],      f: "الطلب الفعال عند كينز يشمل الطلب الخاص الاستهلاكي والاستثماري مضافاً إليه الطلب العام الحكومي."  },
    {    q: "تتميز الإيرادات العامة للدولة في حصولها على الأموال باعتمادها الأساسي على:",     a: 1,     opts: ["التخصيص الاختياري والتعاقد مع الغير", "سلطة الدولة الجبرية في فرض الضرائب والرسوم", "التبرعات والهبات الاختيارية للأفراد", "أرباح المشروعات الفردية الخاصة"],     f: "تعتمد الإيرادات العامة على سلطة الدولة الجبرية في فرض الضرائب والرسوم بخلاف القطاع الخاص."  },
    {    q: "في الفكر الحديث للمالية العامة، وفي حالات الكساد، تسعى الدولة لـ:",    a: 1,     opts: ["الالتزام التام بتساوى الإيرادات مع النفقات وضغط النفقات لأقصى حد", "افتعال عجز (أي زيادة النفقات عن الإيرادات) وتمويله من خلال القروض أو الإصدار النقدي الجديد", "إلغاء الإنفاق العام تماماً وترك الاقتصاد لقوى السوق الحرة", "الاعتماد حصرياً على الإيرادات الاختيارية والدومين العام"],     f: "تسعى الدولة في الفكر الحديث لافتعال عجز مقصود وزيادة الإنفاق لمعالجة الكساد."    },
    {     q: "يعتقد التقليديون أن الاقتصاد يتوازن تلقائياً عند مستوى التوظف الكامل ولا توجد حاجة لتدخل الدولة.",      a: 0,      opts: ["صحيح", "خطأ"],      f: "صحيح، آمن التقليديون بأن الاقتصاد يتوازن تلقائياً بآلية السوق."   },
    {      q: "يوجد حد فاصل وواضح تماماً وثابت بين الحاجة العامة والحاجات الخاصة في كافة المجالات دون أي استثناء.",       a: 1,      opts: ["صحيح", "خطأ"],      f: "خطأ، لا يوجد حد فاصل بينهما باستثناء العدالة والدفاع والأمن (فهي حاجات عامة حصراً)."   },
    {  q: "تستهدف الدولة من نفقاتها العامة تحقيق الصالح العام حتى ولو لم يسفر نشاطها المالي عن تحقيق أرباح.",    a: 0,     opts: ["صحيح", "خطأ"],      f: "صحيح، تستهدف النفقات العامة تحقيق الصالح العام بغض النظر عن الأرباح."  },
    {     q: "يقتصر تعريف المالية العامة في الفكر التقليدي الحديث على تحقيق أهداف الدولة الاقتصادية والاجتماعية والسياسية عن طريق افتعال عجز مقصود.",     a: 1,      opts: ["صحيح", "خطأ"],     f: "خطأ، هذا هو تعريف \"الفكر الحديث\" وليس الفكر التقليدي الذي يرفض العجز ويقيد النفقات."   },
    {    q: "تبدأ الأفراد والمنشآت الخاصة بتقدير أوجه الإنفاق أولاً بأكبر قدر ممكن، ثم تبحث عن تدبير الإيرادات لتغطيتها لاحقاً.",     a: 1,    opts: ["صحيح", "خطأ"],     f: "خطأ، الأفراد يبدأون بتقدير الإيرادات أولاً ثم يقدرون الإنفاق في حدودها."  },
    {    q: "الحاجات العامة غير القابلة للتجزئة هي التي يمكن أن يحصل عليها بعض الأفراد دون باقي أفراد المجتمع مثل التعليم والصحة.",    a: 1,    opts: ["صحيح", "خطأ"],     f: "خطأ، غير القابلة للتجزئة لا يمكن أن يحصل عليها فرد بمفرده (مثل الأمن والدفاع)." },
    {    q: "أكد العالم جون كينز في نظريته على أن الطلب هو الذي يخلق العرض، عكس ما اعتقد التقليديون تماماً.",    a: 0,    opts: ["صحيح", "خطأ"],     f: "صحيح، أكد كينز على أن الطلب الفعال هو المحرك للاقتصاد والعرض." },
    {   q: "تعتمد المالية الخاصة في الحصول على إيراداتها على سلطة الدولة الجبرية في فرض الضرائب والرسوم على الأفراد.",   a: 1,    opts: ["صحيح", "خطأ"],    f: "خطأ، المالية \"العامة\" هي التي تعتمد على السلطة الجبرية وليست الخاصة." },
    {   q: "تتحمل الدولة مسئولية إشباع الحاجات العامة للمجتمع من خلال أدوات المالية العامة.",   a: 0,  opts: ["صحيح", "خطأ"],   f: "صحيح، الدولة تتحمل مسئولية الحاجات العامة عبر أدوات المالية العامة." },
    {  q: "كان الفكر التقليدي يجيز ويشجع اللجوء إلى مصادر استثنائية للحصول على الإيرادات مثل القروض أو الإصدار النقدي الجديد لمعالجة الأزمات.",  a: 1,  opts: ["صحيح", "خطأ"],  f: "خطأ، كان الفكر التقليدي يعارض القروض والإصدار النقدي ويطالب بتساوي الإيرادات والنفقات." }

    };

    const quizzesByLevel = {
        "1": [],
        "2": [],
        "3": ["ch31", "ch32", "ch33", "ch34", "ch35"],
        "4": ["ch41","ch42","ch43","ch44","ch45"]
    };

    const chapterNames = {
        ch31: "المحاسبة المتوسطة (2)",
        ch32: "المحاسبة في الوحدات الحكومية",
        ch33: "ريادة الأعمال",
        ch34: "إدارة الموارد البشرية",
        ch35: "نظم المعلومات المحاسبية",
        ch41:" مقرر اختياري (1) - مراجعة النظم الإلكترونية",
        ch42:"الاساليب الكميه واتخاذ القرار",
        ch43:"المحاسبه الماليه",
        ch44:"مبادئ المالية العامه",
        ch45:"محاسبه ضريبيه"
    };

    const levelNames = {
        "1": "الفرقة الأولى",
        "2": "الفرقة الثانية",
        "3": "الفرقة الثالثة",
        "4": "الفرقة الرابعة"
    };

    function getLoggedUser() {
        const raw = localStorage.getItem("mw_user");
        if (!raw) return null;
        try {
            const user = JSON.parse(raw);
            if (!user || user.success !== true) return null;
            return user;
        } catch (e) {
            return null;
        }
    }

    function getUserLevel(user) {
        return String(user.level ?? user.Level ?? user.year ?? user.grade ?? "").trim();
    }

    function setupByLevel() {
        const user = getLoggedUser();

        if (!user) {
            document.getElementById("quizApp").style.display = "none";
            document.getElementById("accessDenied").style.display = "block";
            return;
        }

        const level = getUserLevel(user);

        if (!levelNames[level]) {
            document.getElementById("quizApp").style.display = "none";
            document.getElementById("accessDenied").style.display = "block";
            document.getElementById("deniedTitle").textContent = "بيانات الفرقة غير صحيحة";
            document.getElementById("deniedText").textContent = "لا توجد فرقة دراسية صحيحة مرتبطة بهذا الحساب.";
            return;
        }

        document.getElementById("quizApp").style.display = "block";
        document.getElementById("studentLevel").textContent =
            "👤 " + (user.name || user.username || "الطالب") +
            " — " + levelNames[level];

        const select = document.getElementById("chapterSelect");
        const chapters = quizzesByLevel[level] || [];
        select.innerHTML = "";

        if (!chapters.length) {
            const option = document.createElement("option");
            option.textContent = "لا توجد أسئلة مضافة لهذه الفرقة بعد";
            option.disabled = true;
            option.selected = true;
            select.appendChild(option);

            document.getElementById("quizContainer").innerHTML =
                '<div class="q-card" style="text-align:center"><h2>📚 بنك الأسئلة</h2><p style="color:var(--text-muted)">لم تتم إضافة أسئلة ' +
                levelNames[level] + ' إلى هذا الملف بعد.</p></div>';

            document.querySelector(".btn-submit").style.display = "none";
            document.getElementById("imgContainer").style.display = "none";
            return;
        }

        chapters.forEach((key, index) => {
            const option = document.createElement("option");
            option.value = key;
            option.textContent = chapterNames[key] || key;
            if (index === 0) option.selected = true;
            select.appendChild(option);
        });

        document.querySelector(".btn-submit").style.display = "block";
        changeChapter();
    }

    function logout() {
        localStorage.removeItem("mw_user");
        location.replace("login.html");
    }

    function changeChapter() {
        const chapter = document.getElementById('chapterSelect').value;
        if (!chapter || !allQuizzes[chapter]) return;
        const imgDiv = document.getElementById('imgContainer');
        const container = document.getElementById('quizContainer');
        const result = document.getElementById('finalResult');
        
        container.innerHTML = "";
        result.style.display = "none";

        // إظهار الصورة إذا كان الفصل المحاسبة الحكومية (ch32)
        if (chapter === 'ch32') {
            imgDiv.style.display = "block";
        } else {
            imgDiv.style.display = "none";
        }
        
        allQuizzes[chapter].forEach((qData, i) => {
            const qCard = document.createElement('div');
            qCard.className = 'q-card';
            
            // قراءة الإجابة من أي تسمية (ans/a/correct)
            const correctAnswer = qData.ans !== undefined ? qData.ans : (qData.a !== undefined ? qData.a : qData.correct);
            qCard.setAttribute('data-ans', correctAnswer);

            let optionsHtml = "";
            qData.opts.forEach((opt, optIndex) => {
                optionsHtml += `
                    <label class="opt-label">
                        <input type="radio" name="q${i}" value="${optIndex}">
                        ${opt}
                    </label>
                `;
            });

            qCard.innerHTML = `
                <div class="q-header">
                    <span class="q-num">سؤال ${i + 1}</span>
                    ${qData.q}
                </div>
                <div class="options-grid">
                    ${optionsHtml}
                </div>
                ${qData.f ? `<p style="color: #38bdf8; font-size: 0.95rem; margin-top: 12px; display:none; background: #0f172a; padding: 10px; border-radius: 8px;" class="feedback">💡 المعلومة / الشرح: ${qData.f}</p>` : ''}
            `;
            container.appendChild(qCard);
        });
    }

    function gradeQuiz() {
        let score = 0;
        const chapter = document.getElementById('chapterSelect').value;
        const cards = document.querySelectorAll('.q-card');
        
        cards.forEach((card) => {
            const correct = parseInt(card.getAttribute('data-ans'));
            const selected = card.querySelector('input:checked');
            const labels = card.querySelectorAll('.opt-label');
            const feedback = card.querySelector('.feedback');

            if (feedback) feedback.style.display = 'block';

            labels.forEach(l => l.className = 'opt-label');
            if (selected) {
                const userAns = parseInt(selected.value);
                if (userAns === correct) { 
                    score++; 
                    labels[userAns].classList.add('correct'); 
                } else { 
                    labels[userAns].classList.add('wrong'); 
                    labels[correct].classList.add('correct'); 
                }
            } else { 
                labels[correct].classList.add('correct'); 
            }
        });

        const result = document.getElementById('finalResult');
        const total = allQuizzes[chapter].length;
        result.style.display = 'block';
        result.innerHTML = `<h2>درجتك: ${score} من ${total}</h2><p>النسبة المئوية: ${Math.round((score/total)*100)}%</p>`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = setupByLevel;
</script>
