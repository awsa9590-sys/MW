<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Quiz Pro | منصة الاختبارات الذكية</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --primary: #38bdf8;
            --secondary: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
            --text-gold: #fbbf24;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin-top: 40px;
        }

        /* رأس الصفحة */
        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        /* قسم اختيار المادة */
        .selection-box {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 40px;
            text-align: center;
        }

        select {
            background: #0f172a;
            color: var(--text-main);
            border: 2px solid var(--primary);
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 1.1rem;
            width: 100%;
            max-width: 400px;
            cursor: pointer;
            outline: none;
        }

        /* تصميم كرت السؤال */
        .q-card {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 24px;
            margin-bottom: 25px;
            border: 1px solid #334155;
            transition: 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .q-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; width: 5px; height: 100%;
            background: var(--primary);
        }

        .q-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .q-num {
            background: var(--primary);
            color: #000;
            font-weight: bold;
            padding: 5px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .q-text {
            font-size: 1.25rem;
            font-weight: 500;
            line-height: 1.6;
        }

        /* خيارات الإجابة */
        .options-grid {
            display: grid;
            gap: 12px;
        }

        .opt-label {
            background: #334155;
            padding: 18px;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: 0.2s;
            border: 2px solid transparent;
        }

        .opt-label:hover {
            background: #475569;
            transform: scale(1.01);
        }

        input[type="radio"] {
            margin-left: 15px;
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
        }

        /* حالات النتيجة */
        .opt-label.correct {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .opt-label.wrong {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .hint {
            margin-top: 15px;
            padding: 10px;
            background: rgba(251, 191, 36, 0.1);
            border-right: 4px solid var(--text-gold);
            color: var(--text-gold);
            font-size: 0.9rem;
            display: none;
        }

        /* أزرار */
        .btn-submit {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3);
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.5);
        }

        /* لوحة النتيجة النهائية */
        #finalResult {
            text-align: center;
            padding: 40px;
            border-radius: 30px;
            margin-bottom: 30px;
            display: none;
            border: 2px solid var(--primary);
        }

        #finalResult h2 { font-size: 3rem; margin: 0; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Smart Quiz Pro</h1>
        <p style="color: var(--text-muted)">نظام الاختبارات الإلكترونية المتكامل</p>
    </header>

    <div class="selection-box">
        <h3 style="margin-top: 0">اختر مادة الاختبار</h3>
        <select id="quizLoader" onchange="initQuiz()">
            </select>
    </div>

    <div id="finalResult"></div>

    <form id="quizForm">
        <div id="quizContainer"></div>
        <button type="button" id="submitBtn" class="btn-submit" onclick="gradeQuiz()" style="display: none;">إنهاء الاختبار وعرض النتيجة</button>
    </form>
</div>

<script>
    // قاعدة بيانات الامتحانات
    const quizData = {
        mgmt: {
            name: "مبادئ الإدارة",
            questions: [
                { q: "تُعرّف الإدارة بأنها عملية تحقيق الأهداف المرسومة باستغلال الموارد المتاحة وفق منهج محدد وضمن:", opts: {A: "موارد مالية ضخمة", B: "بيئة معينة", C: "رقابة صارمة"}, ans: "B" },
                { q: "القدرة على أداء الأعمال بطريقة صحيحة تُسمى:", opts: {A: "الفاعلية", B: "الكفاءة", C: "الإنتاجية"}, ans: "B" },
                { q: "الرقابة هي الوظيفة الأولى في العملية الإدارية.", opts: {صح: "صح", خطأ: "خطأ"}, ans: "خطأ", note: "التخطيط هو الوظيفة الأولى." }
            ]
        },
        hr: {
            name: "الموارد البشرية",
            questions: [
                { q: "البحث عن الكفاءات لسد الوظائف الشاغرة يسمى:", opts: {A: "التعيين", B: "الاستقطاب", C: "الاختبار"}, ans: "B" },
                { q: "إدارة الموارد البشرية تهتم فقط بالموظفين الحاليين.", opts: {صح: "صح", خطأ: "خطأ"}, ans: "خطأ" }
            ]
        }
    };

    // تعبئة القائمة
    const loader = document.getElementById('quizLoader');
    loader.innerHTML = '<option value="">-- اختر المادة --</option>';
    for (let key in quizData) {
        loader.innerHTML += `<option value="${key}">${quizData[key].name}</option>`;
    }

    function initQuiz() {
        const key = loader.value;
        const container = document.getElementById('quizContainer');
        const btn = document.getElementById('submitBtn');
        const res = document.getElementById('finalResult');
        
        container.innerHTML = "";
        res.style.display = "none";
        
        if (!key) { btn.style.display = "none"; return; }
        btn.style.display = "block";

        quizData[key].questions.forEach((item, i) => {
            let optsHtml = "";
            for (let k in item.opts) {
                optsHtml += `
                    <label class="opt-label">
                        <input type="radio" name="q${i}" value="${k}">
                        ${k === 'صح' || k === 'خطأ' ? '' : k + ') '} ${item.opts[k]}
                    </label>
                `;
            }

            container.innerHTML += `
                <div class="q-card" data-ans="${item.ans}">
                    <div class="q-header">
                        <span class="q-num">سؤال ${i+1}</span>
                        <span class="q-text">${item.q}</span>
                    </div>
                    <div class="options-grid">${optsHtml}</div>
                    ${item.note ? `<div class="hint">💡 توضيح: ${item.note}</div>` : ''}
                </div>
            `;
        });
    }

    function gradeQuiz() {
        let score = 0;
        const cards = document.querySelectorAll('.q-card');
        
        cards.forEach(card => {
            const correct = card.getAttribute('data-ans');
            const selected = card.querySelector('input:checked');
            const hint = card.querySelector('.hint');
            
            card.querySelectorAll('.opt-label').forEach(l => l.className = 'opt-label');

            if (selected) {
                if (selected.value === correct) {
                    score++;
                    selected.parentElement.classList.add('correct');
                } else {
                    selected.parentElement.classList.add('wrong');
                    highlight(card, correct);
                    if(hint) hint.style.display = 'block';
                }
            } else {
                highlight(card, correct);
                if(hint) hint.style.display = 'block';
            }
        });

        const final = document.getElementById('finalResult');
        const total = cards.length;
        const ratio = (score/total);
        
        final.style.display = "block";
        final.innerHTML = `<h2>${score} / ${total}</h2><p>${ratio >= 0.5 ? 'أحسنت! لقد اجتزت الاختبار' : 'نأسف، حاول مرة أخرى'}</p>`;
        final.style.borderColor = ratio >= 0.5 ? 'var(--success)' : 'var(--danger)';
        final.style.color = ratio >= 0.5 ? 'var(--success)' : 'var(--danger)';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function highlight(card, val) {
        card.querySelectorAll('input').forEach(input => {
            if (input.value === val) input.parentElement.classList.add('correct');
        });
    }
</script>

</body>
</html>
