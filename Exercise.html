<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>اختبار الفصل الأول - المحاسبة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
padding:30px;
}

.container{
max-width:900px;
margin:auto;
}

header{
text-align:center;
margin-bottom:30px;
}

header h1{
font-size:32px;
margin-bottom:10px;
}

header p{
color:#94a3b8;
}

.progress{
width:100%;
height:10px;
background:#334155;
border-radius:10px;
margin-bottom:30px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0%;
background:#38bdf8;
transition:0.3s;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

.question{
font-size:18px;
margin-bottom:10px;
}

.options label{
display:block;
background:#334155;
padding:10px;
border-radius:8px;
margin-top:8px;
cursor:pointer;
transition:0.2s;
}

.options label:hover{
background:#475569;
}

.correct{
background:#16a34a !important;
}

.wrong{
background:#dc2626 !important;
}

button{
width:100%;
padding:15px;
font-size:18px;
border:none;
border-radius:10px;
background:#0ea5e9;
color:white;
cursor:pointer;
margin-top:20px;
transition:0.2s;
}

button:hover{
background:#0284c7;
}

#result{
text-align:center;
font-size:28px;
margin-bottom:20px;
display:none;
}

.score{
font-size:40px;
color:#38bdf8;
margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<header>
<h1>اختبار الفصل الأول</h1>
<p>المحاسبة عن رأس المال المملوك</p>
</header>

<div class="progress">
<div class="progress-bar" id="bar"></div>
</div>

<div id="result"></div>

<form id="quiz">
<div id="questions"></div>

<button type="button" onclick="check()">عرض النتيجة</button>

</form>

</div>

<script>

const questions=[

{q:"يتكون رأس مال الشركة المساهمة من:",o:["سندات","حصص متساوية تسمى أسهم","قروض","ودائع"],a:1},

{q:"المصدران الأساسيان لتمويل الأصول:",o:["الإيرادات والمصروفات","الأصول والخصوم","حقوق الملكية والخصوم","الأرباح والخسائر"],a:2},

{q:"المعادلة المحاسبية:",o:["الأصول = المصروفات + الإيرادات","الأصول = الخصوم + حقوق الملكية","الأصول = الإيرادات - المصروفات","الأصول = رأس المال"],a:1},

{q:"السهم يمثل:",o:["دين على الشركة","حصة في رأس المال","قرض","أصل ثابت"],a:1},

{q:"القيمة التي يحددها القانون للسهم:",o:["السوقية","الاسمية","العادلة","الدفترية"],a:1},

{q:"من حقوق المساهم:",o:["الحصول على فائدة","المشاركة في الإدارة","سداد القروض","إدارة الحسابات"],a:1},

{q:"يحق للمساهم:",o:["الاشتراك في الأرباح","تحديد الأسعار","تعيين العمال","إصدار السندات"],a:0},

{q:"الأسهم ذات المزايا الخاصة:",o:["عادية","ممتازة","نقدية","اسمية"],a:1},

{q:"الأسهم التي تسدد نقداً:",o:["نقدية","عينية","منحة","تمتع"],a:0},

{q:"الأسهم مقابل أصول:",o:["نقدية","عينية","ممتازة","ذهبية"],a:1},

{q:"الأسهم المجانية:",o:["ممتازة","منحة","عينية","ذهبية"],a:1},

{q:"الشهادة مقابل اختراع:",o:["أسهم تمتع","حصص تأسيس","أسهم عادية","أسهم نقدية"],a:1},

{q:"الأسهم البديلة للأسهم المستهلكة:",o:["تمتع","عادية","ذهبية","ممتازة"],a:0},

{q:"القيمة الاسمية للسهم:",o:["أقل من جنيه","5 إلى 1000 جنيه","1000 إلى 5000","غير محددة"],a:1},

{q:"عند التصفية يحصل المساهم على:",o:["أجر","جزء من الأصول","راتب","مكافأة"],a:1},

{q:"الأسهم العادية تمنح:",o:["مزايا خاصة","الحقوق الأساسية","بدون حقوق","أرباح ثابتة"],a:1},

{q:"الأسهم الممتازة تتميز:",o:["عدم أرباح","مزايا خاصة","عدم ملكية","عدم تداول"],a:1},

{q:"المساهم يمتلك:",o:["جزء من الأصول","جزء من رأس المال","جزء من المصروفات","جزء من الديون"],a:1},

{q:"الخصوم تمثل:",o:["حقوق الملاك","التزامات للغير","أرباح","إيرادات"],a:1},

{q:"حقوق الملكية تمثل:",o:["أموال الملاك","القروض","المصروفات","الإيرادات"],a:0}

];

const container=document.getElementById("questions");

questions.forEach((e,i)=>{

let html=`<div class="card" id="q${i}">
<div class="question"><b>س${i+1}:</b> ${e.q}</div>
<div class="options">`;

e.o.forEach((opt,index)=>{

html+=`<label><input type="radio" name="q${i}" value="${index}" onclick="updateProgress()"> ${opt}</label>`;

});

html+=`</div></div>`;

container.innerHTML+=html;

});

function updateProgress(){

let answered=document.querySelectorAll("input:checked").length;
let percent=(answered/questions.length)*100;
document.getElementById("bar").style.width=percent+"%";

}

function check(){

let score=0;

questions.forEach((e,i)=>{

let card=document.getElementById("q"+i);
let selected=document.querySelector(`input[name=q${i}]:checked`);
let labels=card.querySelectorAll("label");

labels.forEach(l=>l.classList.remove("correct","wrong"));

if(selected){

if(parseInt(selected.value)==e.a){

score++;
labels[e.a].classList.add("correct");

}else{

labels[selected.value].classList.add("wrong");
labels[e.a].classList.add("correct");

}

}else{

labels[e.a].classList.add("correct");

}

});

let res=document.getElementById("result");

res.style.display="block";

res.innerHTML=`النتيجة النهائية<div class="score">${score} / ${questions.length}</div>`;

window.scrollTo({top:0,behavior:"smooth"});

}

</script>

</body>
</html>
