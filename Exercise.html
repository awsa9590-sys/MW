<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة اختبارات المحاسبة المتوسطة</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --primary: #38bdf8;
            --secondary: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .selector-box {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid #334155;
        }

        select {
            background: #0f172a;
            color: var(--text-main);
            border: 2px solid var(--primary);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            width: 100%;
            max-width: 400px;
            outline: none;
            cursor: pointer;
        }

        .q-card {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            transition: 0.3s;
        }

        .q-header {
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .q-num {
            background: var(--primary);
            color: #000;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-left: 10px;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .opt-label {
            background: #334155;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .opt-label:hover { background: #475569; }

        input[type="radio"] {
            margin-left: 15px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .opt-label.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .opt-label.wrong { border-color: var(--danger); background: rgba(239, 68, 68, 0.15); color: var(--danger); }

        .btn-submit {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }

        #finalResult {
            display: none;
            text-align: center;
            padding: 30px;
            background: var(--bg-card);
            border-radius: 20px;
            margin-bottom: 30px;
            border: 2px solid var(--primary);
        }
    </style>
</head>
<body>

<div id="accessDenied" style="display:none; max-width:700px; margin:80px auto; text-align:center; background:#1e293b; padding:35px; border-radius:20px; border:1px solid #334155;">
        <div style="font-size:55px;">🔒</div>
        <h2>يجب تسجيل الدخول أولاً</h2>
        <p style="color:#94a3b8">سيتم عرض بنك الأسئلة الخاص بفرقتك فقط.</p>
        <button class="btn-submit" style="max-width:350px" onclick="location.href='login.html'">تسجيل الدخول</button>
    </div>

<div id="appContent" class="container" style="display:none;">
    <header>
        <h1>منصة الاختبارات الذكية</h1>
        <p style="color: var(--text-muted)">المحاسبة المتوسطة (2)</p>
    </header>

    <div class="selector-box">
        <label style="display: block; margin-bottom: 10px;">اختر الفصل الدراسي:</label>
        <select id="chapterSelect" onchange="changeChapter()"></select>
        <div id="levelInfo" style="margin-top:12px;color:var(--text-muted);font-size:.95rem"></div>
    </div>
<div id="imgContainer" style="display: none; text-align: center; margin: 20px 0;">
    <p id="imgLabel" style="margin-bottom: 15px; font-size: 1.1rem; color: #38bdf8; font-weight: bold;">
        📊 الصورة المرجعية للحالة العملية (ديوان عام محافظة القاهرة):
    </p>
    <img src="WhatsApp Image 2026-03-06 at 1.35.53 AM.jpeg" 
         id="refImage" 
         alt="بيانات الأجور والاستقطاعات" 
         style="width: 100%; max-width: 600px; border: 3px solid #38bdf8; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
</div>
    <div id="finalResult"></div>

    <form id="quizForm">
        <div id="quizContainer"></div>
        <button type="button" class="btn-submit" onclick="gradeQuiz()">عرض النتيجة النهائية</button>
    </form>
</div>

</div><!-- /appContent -->

function changeChapter() {
    const chapter = document.getElementById('chapterSelect').value;
    const imgDiv = document.getElementById('imgContainer');
    const container = document.getElementById('quizContainer');
    const result = document.getElementById('finalResult');
    
    container.innerHTML = ""; // مسح الأسئلة القديمة
    result.style.display = "none";

    // إظهار الصورة فقط إذا كان الفصل هو المحاسبة الحكومية (ch2)
    if (chapter === 'ch2') {
        imgDiv.style.display = "block";
    } else {
        imgDiv.style.display = "none";
    }
    
    // الجزء المصلح: بناء الأسئلة برمجياً
    allQuizzes[chapter].forEach((qData, i) => {
        const qCard = document.createElement('div');
        qCard.className = 'q-card';
        // تخزين الإجابة الصحيحة في سمة مخصصة للمقارنة لاحقاً
        const correctAnswer = qData.ans !== undefined ? qData.ans : qData.a;
        qCard.setAttribute('data-ans', correctAnswer);

        let optionsHtml = "";
        qData.opts.forEach((opt, optIndex) => {
            optionsHtml += `
                <label class="opt-label">
                    <input type="radio" name="q${i}" value="${optIndex}">
                    ${opt}
                </label>
            `;
        });

        qCard.innerHTML = `
            <div class="q-header">
                <span class="q-num">سؤال ${i + 1}</span>
                ${qData.q}
            </div>
            <div class="options-grid">
                ${optionsHtml}
            </div>
            ${qData.f ? `<p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 10px; display:none;" class="feedback">💡 معلومة: ${qData.f}</p>` : ''}
        `;
        container.appendChild(qCard);
    });
}

    function gradeQuiz() {
        let score = 0;
        const chapter = document.getElementById('chapterSelect').value;
        const cards = document.querySelectorAll('.q-card');
        cards.forEach((card, i) => {
            const correct = parseInt(card.getAttribute('data-ans'));
            const selected = card.querySelector('input:checked');
            const labels = card.querySelectorAll('.opt-label');
            labels.forEach(l => l.className = 'opt-label');
            if (selected) {
                const userAns = parseInt(selected.value);
                if (userAns === correct) { score++; labels[userAns].classList.add('correct'); }
                else { labels[userAns].classList.add('wrong'); labels[correct].classList.add('correct'); }
            } else { labels[correct].classList.add('correct'); }
        });
        const result = document.getElementById('finalResult');
        const total = allQuizzes[chapter].length;
        result.style.display = 'block';
        result.innerHTML = `<h2>درجتك: ${score} من ${total}</h2><p>النسبة المئوية: ${Math.round((score/total)*100)}%</p>`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function getLoggedUser() {
        const raw = localStorage.getItem("mw_user");
        if (!raw) return null;
        try {
            const user = JSON.parse(raw);
            if (!user || user.success !== true) return null;
            return user;
        } catch (e) {
            return null;
        }
    }

    function getLevel(user) {
        return String(user.level ?? user.Level ?? user.year ?? user.grade ?? "").trim();
    }

    function setupByLevel() {
        const user = getLoggedUser();

        if (!user) {
            document.getElementById("appContent").style.display = "none";
            document.getElementById("accessDenied").style.display = "block";
            return;
        }

        const level = getLevel(user);
        const levelNames = {
            "1":"الفرقة الأولى",
            "2":"الفرقة الثانية",
            "3":"الفرقة الثالثة",
            "4":"الفرقة الرابعة"
        };

        if (!levelNames[level]) {
            document.getElementById("appContent").style.display = "none";
            document.getElementById("accessDenied").style.display = "block";
            document.querySelector("#accessDenied h2").textContent = "بيانات الفرقة غير صحيحة";
            document.querySelector("#accessDenied p").textContent =
                "لا توجد فرقة دراسية صحيحة مرتبطة بهذا الحساب.";
            return;
        }

        document.getElementById("appContent").style.display = "block";

        const select = document.getElementById("chapterSelect");
        const chapters = quizzesByLevel[level] || [];

        select.innerHTML = "";

        if (!chapters.length) {
            const opt = document.createElement("option");
            opt.textContent = "لا توجد أسئلة مضافة لهذه الفرقة بعد";
            opt.disabled = true;
            opt.selected = true;
            select.appendChild(opt);

            document.getElementById("levelInfo").textContent =
                "👤 " + (user.name || user.username || "الطالب") +
                " — " + levelNames[level];

            document.getElementById("quizContainer").innerHTML =
                '<div class="q-card" style="text-align:center"><h2>📚 بنك الأسئلة</h2><p style="color:var(--text-muted)">سيتم إضافة أسئلة هذه الفرقة هنا.</p></div>';

            document.querySelector(".btn-submit").style.display = "none";
            document.getElementById("imgContainer").style.display = "none";
            return;
        }

        chapters.forEach((key, index) => {
            const opt = document.createElement("option");
            opt.value = key;
            opt.textContent = chapterNames[key] || key;
            if (index === 0) opt.selected = true;
            select.appendChild(opt);
        });

        document.getElementById("levelInfo").textContent =
            "👤 " + (user.name || user.username || "الطالب") +
            " — " + levelNames[level];

        document.querySelector(".btn-submit").style.display = "block";
        changeChapter();
    }

    window.onload = setupByLevel;
</script>
</body>
</html>
