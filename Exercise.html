<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة اختبارات المحاسبة المتوسطة</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --primary: #38bdf8;
            --secondary: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .selector-box {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid #334155;
        }

        select {
            background: #0f172a;
            color: var(--text-main);
            border: 2px solid var(--primary);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            width: 100%;
            max-width: 400px;
            outline: none;
            cursor: pointer;
        }

        .q-card {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            transition: 0.3s;
        }

        .q-header {
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .q-num {
            background: var(--primary);
            color: #000;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-left: 10px;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .opt-label {
            background: #334155;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .opt-label:hover { background: #475569; }

        input[type="radio"] {
            margin-left: 15px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .opt-label.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .opt-label.wrong { border-color: var(--danger); background: rgba(239, 68, 68, 0.15); color: var(--danger); }

        .btn-submit {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }

        #finalResult {
            display: none;
            text-align: center;
            padding: 30px;
            background: var(--bg-card);
            border-radius: 20px;
            margin-bottom: 30px;
            border: 2px solid var(--primary);
        }
    </style>
</head>
<body>

<div id="accessDenied" style="display:none;max-width:850px;margin:80px auto;text-align:center;background:var(--bg-card);padding:40px;border-radius:20px;border:1px solid #334155;">
    <div style="font-size:60px;">🔒</div>
    <h2 id="deniedTitle">تسجيل الدخول مطلوب</h2>
    <p id="deniedText" style="color:var(--text-muted);">يجب تسجيل الدخول لفتح بنك الأسئلة.</p>
    <button class="btn-submit" style="max-width:400px;" onclick="location.href='login.html'">تسجيل الدخول</button>
</div>

<div id="quizApp" class="container" style="display:none;">
    <header>
        <h1>منصة الاختبارات الذكية</h1>
        <p style="color: var(--text-muted)">المحاسبة المتوسطة (2)</p>
    </header>

    <div class="selector-box">
        <label style="display: block; margin-bottom: 10px;">اختر المادة / الفصل الدراسي:</label>
        <select id="chapterSelect" onchange="changeChapter()"></select>
        <div id="studentLevel" style="margin-top:10px;color:var(--text-muted);font-size:.95rem;"></div>
        <button type="button" onclick="logout()" style="
            margin-top:14px;padding:10px 20px;border:0;border-radius:10px;
            background:#ef4444;color:#fff;cursor:pointer;font-weight:bold;">
            🚪 تسجيل الخروج
        </button>
    </div>

    <div id="imgContainer" style="display: none; text-align: center; margin: 20px 0;">
        <p id="imgLabel" style="margin-bottom: 15px; font-size: 1.1rem; color: #38bdf8; font-weight: bold;">
            📊 الصورة المرجعية للحالة العملية (ديوان عام محافظة القاهرة):
        </p>
        <img src="WhatsApp Image 2026-03-06 at 1.35.53 AM.jpeg" 
             id="refImage" 
             alt="بيانات الأجور والاستقطاعات" 
             style="width: 100%; max-width: 600px; border: 3px solid #38bdf8; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
    </div>

    <div id="finalResult"></div>

    <form id="quizForm">
        <div id="quizContainer"></div>
        <button type="button" class="btn-submit" onclick="gradeQuiz()">عرض النتيجة النهائية</button>
    </form>
</div>

        ch41: [

            { q: "يختلف نظام المعلومات اليدوي عن الإلكتروني في تطبيق دورة إنتاج المعلومات (I/P/O Cycle).", a: 1, opts: ["صواب", "خطأ"], f: "خطأ، كلاهما يطبقان نفس دورة إنتاج المعلومات (Input / Process / Output)." },

            { q: "من خصائص النظام عدم قابليته للمراجعة والتطوير أو المرونة بعد تصميمه.", a: 1, opts: ["صواب", "خطأ"], f: "خطأ، من الخصائص الرئيسية لأي نظام نِشِط هي المرونة والقابلية للمراجعة والتطوير." }

    const quizzesByLevel = {
        "1": [],
        "2": [],
        "3": ["ch31", "ch32", "ch33", "ch34", "ch35"],
        "4": ["ch41"]
    };

    const chapterNames = {
        ch31: "المحاسبة المتوسطة (2)",
        ch32: "المحاسبة في الوحدات الحكومية",
        ch33: "ريادة الأعمال",
        ch34: "إدارة الموارد البشرية",
        ch35: "نظم المعلومات المحاسبية",
        ch41:" مقرر اختياري (1) - مراجعة النظم الإلكترونية"
    };

    const levelNames = {
        "1": "الفرقة الأولى",
        "2": "الفرقة الثانية",
        "3": "الفرقة الثالثة",
        "4": "الفرقة الرابعة"
    };

    function getLoggedUser() {
        const raw = localStorage.getItem("mw_user");
        if (!raw) return null;
        try {
            const user = JSON.parse(raw);
            if (!user || user.success !== true) return null;
            return user;
        } catch (e) {
            return null;
        }
    }

    function getUserLevel(user) {
        return String(user.level ?? user.Level ?? user.year ?? user.grade ?? "").trim();
    }

    function setupByLevel() {
        const user = getLoggedUser();

        if (!user) {
            document.getElementById("quizApp").style.display = "none";
            document.getElementById("accessDenied").style.display = "block";
            return;
        }

        const level = getUserLevel(user);

        if (!levelNames[level]) {
            document.getElementById("quizApp").style.display = "none";
            document.getElementById("accessDenied").style.display = "block";
            document.getElementById("deniedTitle").textContent = "بيانات الفرقة غير صحيحة";
            document.getElementById("deniedText").textContent = "لا توجد فرقة دراسية صحيحة مرتبطة بهذا الحساب.";
            return;
        }

        document.getElementById("quizApp").style.display = "block";
        document.getElementById("studentLevel").textContent =
            "👤 " + (user.name || user.username || "الطالب") +
            " — " + levelNames[level];

        const select = document.getElementById("chapterSelect");
        const chapters = quizzesByLevel[level] || [];
        select.innerHTML = "";

        if (!chapters.length) {
            const option = document.createElement("option");
            option.textContent = "لا توجد أسئلة مضافة لهذه الفرقة بعد";
            option.disabled = true;
            option.selected = true;
            select.appendChild(option);

            document.getElementById("quizContainer").innerHTML =
                '<div class="q-card" style="text-align:center"><h2>📚 بنك الأسئلة</h2><p style="color:var(--text-muted)">لم تتم إضافة أسئلة ' +
                levelNames[level] + ' إلى هذا الملف بعد.</p></div>';

            document.querySelector(".btn-submit").style.display = "none";
            document.getElementById("imgContainer").style.display = "none";
            return;
        }

        chapters.forEach((key, index) => {
            const option = document.createElement("option");
            option.value = key;
            option.textContent = chapterNames[key] || key;
            if (index === 0) option.selected = true;
            select.appendChild(option);
        });

        document.querySelector(".btn-submit").style.display = "block";
        changeChapter();
    }

    function logout() {
        localStorage.removeItem("mw_user");
        location.replace("login.html");
    }

    function changeChapter() {
        const chapter = document.getElementById('chapterSelect').value;
        if (!chapter || !allQuizzes[chapter]) return;
        const imgDiv = document.getElementById('imgContainer');
        const container = document.getElementById('quizContainer');
        const result = document.getElementById('finalResult');
        
        container.innerHTML = "";
        result.style.display = "none";

        // إظهار الصورة إذا كان الفصل المحاسبة الحكومية (ch32)
        if (chapter === 'ch32') {
            imgDiv.style.display = "block";
        } else {
            imgDiv.style.display = "none";
        }
        
        allQuizzes[chapter].forEach((qData, i) => {
            const qCard = document.createElement('div');
            qCard.className = 'q-card';
            
            // قراءة الإجابة من أي تسمية (ans/a/correct)
            const correctAnswer = qData.ans !== undefined ? qData.ans : (qData.a !== undefined ? qData.a : qData.correct);
            qCard.setAttribute('data-ans', correctAnswer);

            let optionsHtml = "";
            qData.opts.forEach((opt, optIndex) => {
                optionsHtml += `
                    <label class="opt-label">
                        <input type="radio" name="q${i}" value="${optIndex}">
                        ${opt}
                    </label>
                `;
            });

            qCard.innerHTML = `
                <div class="q-header">
                    <span class="q-num">سؤال ${i + 1}</span>
                    ${qData.q}
                </div>
                <div class="options-grid">
                    ${optionsHtml}
                </div>
                ${qData.f ? `<p style="color: #38bdf8; font-size: 0.95rem; margin-top: 12px; display:none; background: #0f172a; padding: 10px; border-radius: 8px;" class="feedback">💡 المعلومة / الشرح: ${qData.f}</p>` : ''}
            `;
            container.appendChild(qCard);
        });
    }

    function gradeQuiz() {
        let score = 0;
        const chapter = document.getElementById('chapterSelect').value;
        const cards = document.querySelectorAll('.q-card');
        
        cards.forEach((card) => {
            const correct = parseInt(card.getAttribute('data-ans'));
            const selected = card.querySelector('input:checked');
            const labels = card.querySelectorAll('.opt-label');
            const feedback = card.querySelector('.feedback');

            if (feedback) feedback.style.display = 'block';

            labels.forEach(l => l.className = 'opt-label');
            if (selected) {
                const userAns = parseInt(selected.value);
                if (userAns === correct) { 
                    score++; 
                    labels[userAns].classList.add('correct'); 
                } else { 
                    labels[userAns].classList.add('wrong'); 
                    labels[correct].classList.add('correct'); 
                }
            } else { 
                labels[correct].classList.add('correct'); 
            }
        });

        const result = document.getElementById('finalResult');
        const total = allQuizzes[chapter].length;
        result.style.display = 'block';
        result.innerHTML = `<h2>درجتك: ${score} من ${total}</h2><p>النسبة المئوية: ${Math.round((score/total)*100)}%</p>`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = setupByLevel;
</script>
