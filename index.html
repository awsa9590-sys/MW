<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHAMED WALID | المحاسبة المتوسطة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> 
    <style>
        :root { --primary: #0056b3; --secondary: #28a745; --info: #17a2b8; --dark: #1e293b; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8fafc; margin: 0; direction: rtl; }
        header { background: var(--dark); color: white; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hero { background: linear-gradient(135deg, #0f172a, #1e293b); color: white; padding: 60px 20px; text-align: center; clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%); }
        .profile-img { width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--secondary); box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: 0.5s; }
        .profile-img:hover { transform: scale(1.05) rotate(5deg); }
        .container { max-width: 1100px; margin: -40px auto 50px; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: 0.3s; text-align: center; border-top: 5px solid transparent; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .card.exercise { border-top-color: var(--secondary); }
        .card.summaries { border-top-color: var(--info); }
        .card i { font-size: 3rem; margin-bottom: 20px; }
        .btn { display: inline-block; width: 80%; padding: 12px; margin-top: 20px; border-radius: 10px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn-exercise { background: var(--secondary); color: white; }
        .btn-summaries { background: var(--info); color: white; }
        .btn:hover { opacity: 0.9; transform: scale(1.02); }
    </style>
</head>
<body>
    <header><h1> WALID & SPIDER </h1></header>
    <section class="hero">
        <img src="1000119623.jpg" alt="Logo" class="profile-img">
        <h2>🚀 طريقك للتميز في المحاسبة</h2>
        <p>منصة متكاملة للمراجعة النهائية والاختبارات التفاعلية</p>
    </section>
    <section class="container">
        <div class="card exercise">
            <i class="fa-solid fa-laptop-code" style="color: var(--secondary);"></i>
            <h3>بنك الأسئلة</h3>
            <p>تدرب على أنظمة الامتحانات الحديثة وصحح أخطاءك فوراً.</p>
            <a href="Exercise.html" class="btn btn-exercise">ابدأ التحدي الآن</a>
        </div>
        <div class="card summaries">
            <i class="fa-solid fa-book-open-reader" style="color: var(--info);"></i>
            <h3>المخلصات الذكية</h3>
            <p>شرح مبسط ومكثف لأهم نقاط المنهج والقيود المحاسبية.</p>
            <a href="Reader.html" class="btn btn-info">تصفح الملخصات</a>
        </div>
    </section>
</body>
</html>
