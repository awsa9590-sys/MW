<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والإدارة | WALID & SPIDER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0056b3;
            --success: #28a745;
            --danger: #dc3545;
            --dark: #0f172a;
            --light: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--light);
            margin: 0;
            direction: rtl;
        }

        header {
            background: var(--dark);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        nav {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        nav a:hover {
            background: var(--primary);
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-top: 5px solid var(--danger);
            margin-bottom: 30px;
        }

        h2 {
            color: var(--dark);
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: inherit;
        }

        .btn-submit {
            background: var(--danger);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        #statusMessage {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <script>
        // التحقق من صلاحيات الأدمن عند فتح الصفحة
        (function () {
            const savedUser = localStorage.getItem("mw_user");
            if (!savedUser) { window.location.replace("login.html"); return; }
            try {
                const user = JSON.parse(savedUser);
                if (!user || (user.username !== "Mohamed" && user.role !== 'admin')) {
                    alert("غير مسموح لك بدخول هذه الصفحة!");
                    window.location.replace("index.html");
                }
            } catch (error) {
                window.location.replace("login.html");
            }
        })();
    </script>

    <header>
        <h1><i class="fa-solid fa-gears"></i> لوحة التحكم والإدارة</h1>
        <nav>
            <a href="index.html"><i class="fa-solid fa-house"></i> الصفحة الرئيسية</a>
            <a href="Reader.html"><i class="fa-solid fa-book-open"></i> عرض الملخصات</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h2><i class="fa-solid fa-cloud-arrow-up"></i> إضافة ملخص أو فيديو جديد</h2>
            
            <form id="addContentForm" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label>نوع المحتوى:</label>
                    <select id="contentType" required>
                        <option value="summary">ملخص (PDF / مستند)</option>
                        <option value="video">فيديو شرح (محاضرة)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>الفرقة الدراسية:</label>
                    <select id="level" required>
                        <option value="1">الفرقة الأولى</option>
                        <option value="2">الفرقة الثانية</option>
                        <option value="3">الفرقة الثالثة</option>
                        <option value="4">الفرقة الرابعة</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>اسم المادة:</label>
                    <input type="text" id="subjectName" placeholder="مثال: المحاسبة المتوسطة" required>
                </div>

                <div class="form-group">
                    <label>عنوان الملخص / الفيديو:</label>
                    <input type="text" id="title" placeholder="مثال: ملخص الفصل الأول / محاضرة القيود المحاسبية" required>
                </div>

                <div class="form-group">
                    <label>رابط المحتوى (URL):</label>
                    <input type="url" id="link" placeholder="ضع رابط Drive أو YouTube أو الرابط المباشر هنا" required>
                </div>

                <button type="submit" class="btn-submit">نشر المحتوى الآن</button>
            </form>

            <div id="statusMessage"></div>
        </div>
    </div>

    <script>
        function handleSubmit(e) {
            e.preventDefault();
            const status = document.getElementById("statusMessage");
            
            const data = {
                type: document.getElementById("contentType").value,
                level: document.getElementById("level").value,
                subject: document.getElementById("subjectName").value.trim(),
                title: document.getElementById("title").value.trim(),
                link: document.getElementById("link").value.trim(),
                date: new Date().toLocaleDateString('ar-EG')
            };

            // حفظ البيانات محلياً للتجربة (يمكن ربطها مع Google Apps Script لاحقاً)
            let existingData = JSON.parse(localStorage.getItem("mw_content_list") || "[]");
            existingData.push(data);
            localStorage.setItem("mw_content_list", JSON.stringify(existingData));

            status.style.color = "green";
            status.textContent = "✓ تم حفظ ونشر المحتوى بنجاح!";
            
            document.getElementById("addContentForm").reset();
            
            setTimeout(() => {
                status.textContent = "";
            }, 3000);
        }
    </script>
</body>
</html>
