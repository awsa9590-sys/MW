<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول | WALID & SPIDER</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:"Segoe UI",Tahoma,sans-serif;

background:linear-gradient(135deg,#0f172a,#0056b3);

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

}

.login-box{

width:90%;

max-width:430px;

background:white;

padding:35px;

border-radius:25px;

box-shadow:0 20px 50px rgba(0,0,0,.3);

text-align:center;

}

.logo{

width:100px;

height:100px;

border-radius:50%;

object-fit:cover;

margin-bottom:15px;

}

h1{

color:#0f172a;

margin-bottom:5px;

}

.subtitle{

color:#777;

margin-bottom:25px;

}

.input{

width:100%;

padding:14px;

margin:8px 0;

border:1px solid #ddd;

border-radius:10px;

font-size:16px;

direction:rtl;

}

.login-btn{

width:100%;

padding:14px;

margin-top:15px;

border:none;

border-radius:10px;

background:#0056b3;

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;

}

.login-btn:hover{

background:#003f82;

}

#message{

margin-top:15px;

font-weight:bold;

min-height:25px;

}

.home{

display:block;

margin-top:20px;

color:#0056b3;

text-decoration:none;

}

</style>

</head>

<body>

<div class="login-box">

<img src="1000119623.jpg"
class="logo"
alt="WALID & SPIDER">

<h1>WALID & SPIDER</h1>

<p class="subtitle">
منصة المحاسبة التعليمية
</p>

<input
id="username"
class="input"
type="text"
placeholder="اسم المستخدم">

<input
id="password"
class="input"
type="password"
placeholder="كلمة المرور">

<button
class="login-btn"
onclick="login()">

تسجيل الدخول

</button>

<div id="message"></div>

<a class="home" href="index.html">
العودة إلى الرئيسية
</a>

</div>

<script>

const API_URL =
"ضع_هنا_رابط_Google_Apps_Script";

function login(){

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value.trim();

const message =
document.getElementById("message");

if(!username || !password){

message.style.color="red";

message.textContent=
"من فضلك أدخل اسم المستخدم وكلمة المرور";

return;

}

message.style.color="#555";

message.textContent="جاري التحقق...";

const callback =
"loginCallback_" + Date.now();

window[callback] = function(result){

if(result.success){

localStorage.setItem(
"mw_user",
JSON.stringify(result)
);

message.style.color="green";

message.textContent=
"تم تسجيل الدخول بنجاح ✓";

setTimeout(function(){

window.location.href="dashboard.html";

},700);

}else{

message.style.color="red";

message.textContent=result.message;

}

delete window[callback];

};

const script =
document.createElement("script");

script.src =
API_URL
+
"?username="
+
encodeURIComponent(username)
+
"&password="
+
encodeURIComponent(password)
+
"&callback="
+
callback;

document.body.appendChild(script);

}

document.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

login();

}

});

</script>

</body>

</html>
