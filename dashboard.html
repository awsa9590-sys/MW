<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>لوحة الطالب | WALID & SPIDER</title>

<style>

body{

margin:0;

font-family:"Segoe UI",Tahoma,sans-serif;

background:#f4f7fb;

}

header{

background:#0f172a;

color:white;

padding:20px;

display:flex;

justify-content:space-between;

align-items:center;

}

.logout{

background:#dc2626;

color:white;

border:none;

padding:10px 18px;

border-radius:8px;

cursor:pointer;

}

.container{

max-width:1100px;

margin:40px auto;

padding:20px;

}

.welcome{

background:linear-gradient(
135deg,
#0056b3,
#0f172a
);

color:white;

padding:35px;

border-radius:20px;

margin-bottom:30px;

}

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(230px,1fr));

gap:20px;

}

.card{

background:white;

padding:30px;

border-radius:18px;

text-align:center;

box-shadow:
0 8px 25px rgba(0,0,0,.08);

}

.card a{

display:block;

background:#0056b3;

color:white;

padding:12px;

border-radius:8px;

text-decoration:none;

margin-top:15px;

}

.hidden{

display:none;

}

</style>

</head>

<body>

<header>

<h2>🎓 WALID & SPIDER</h2>

<button
class="logout"
onclick="logout()">

تسجيل الخروج

</button>

</header>

<div class="container">

<div class="welcome">

<h1 id="welcome">
مرحبًا
</h1>

<p id="info"></p>

</div>

<div class="cards">

<div class="card">

<h2>📝 بنك الأسئلة</h2>

<p>
اختبر معلوماتك وتدرب على الأسئلة.
</p>

<a href="Exercise.html">
دخول
</a>

</div>

<div class="card">

<h2>📚 الملخصات</h2>

<p>
راجع المحاضرات والملخصات.
</p>

<a href="Reader.html">
دخول
</a>

</div>

<div class="card">

<h2>🎯 الاختبارات</h2>

<p>
ابدأ الاختبار الإلكتروني.
</p>

<a href="exam.html">
دخول
</a>

</div>

</div>

</div>

<script>

const data =
localStorage.getItem("mw_user");

if(!data){

window.location.href="login.html";

}

const user =
JSON.parse(data);

document.getElementById("welcome").textContent =
"مرحبًا " + user.name + " 👋";

const levels = {

"1":"الفرقة الأولى",

"2":"الفرقة الثانية",

"3":"الفرقة الثالثة",

"4":"الفرقة الرابعة"

};

document.getElementById("info").textContent =
"أنت مسجل في " +
(levels[user.level] || "غير محددة");

function logout(){

localStorage.removeItem("mw_user");

window.location.href="login.html";

}

</script>

</body>

</html>
